group: Stats
help: Roll for dex
commands:
  - dex
  - dexterity
formats:
  - "**Bulbasaur**, the Seed Pokémon\nBulbasaur can be seen napping in bright sunlight. There is a seed on its back. By soaking up the sun’s rays, the seed grows progressively larger."
  - "**Ivysaur**, the Seed Pokémon\nThere is a bud on this Pokémon’s back. To support its weight, Ivysaur’s legs and trunk grow thick and strong. If it starts spending more time lying in the sunlight, it’s a sign that the bud will bloom into a large flower soon."
  - "**Venusaur**, the Seed Pokémon\nThere is a large flower on Venusaur’s back. The flower is said to take on vivid colors if it gets plenty of nutrition and sunlight. The flower’s aroma soothes the emotions of people."
  - "**Charmander**, the Lizard Pokémon\nThe flame that burns at the tip of its tail is an indication of its emotions. The flame wavers when Charmander is enjoying itself. If the Pokémon becomes enraged, the flame burns fiercely."
  - "**Charmeleon**, the Flame Pokémon\nCharmeleon mercilessly destroys its foes using its sharp claws. If it encounters a strong foe, it turns aggressive. In this excited state, the flame at the tip of its tail flares with a bluish white color."
  - "**Charizard**, the Flame Pokémon\nCharizard flies around the sky in search of powerful opponents. It breathes fire of such great heat that it melts anything. However, it never turns its fiery breath on any opponent weaker than itself."
  - "**Squirtle**, the Tiny Turtle Pokémon\nSquirtle’s shell is not merely used for protection. The shell’s rounded shape and the grooves on its surface help minimize resistance in water, enabling this Pokémon to swim at high speeds."
  - "**Wartortle**, the Turtle Pokémon\nIts tail is large and covered with a rich, thick fur. The tail becomes increasingly deeper in color as Wartortle ages. The scratches on its shell are evidence of this Pokémon’s toughness as a battler."
  - "**Blastoise**, the Shellfish Pokémon\nBlastoise has water spouts that protrude from its shell. The water spouts are very accurate. They can shoot bullets of water with enough accuracy to strike empty cans from a distance of over 160 feet."
  - "**Caterpie**, the Worm Pokémon\nIts body is soft and weak. In nature, its perpetual fate is to be seen by others as food."
  - "**Metapod**, the Cocoon Pokémon\nIts hard shell doesn’t crack a bit even if Pikipek pecks at it, but it will tip over, spilling out its insides."
  - "**Butterfree**, the Butterfly Pokémon\nNectar from pretty flowers is its favorite food. In fields of flowers, it has heated battles with Cutiefly for territory."
  - "**Weedle**, the Hairy Bug Pokémon\nWeedle has an extremely acute sense of smell. It is capable of distinguishing its favorite kinds of leaves from those it dislikes just by sniffing with its big red proboscis (nose)."
  - "**Kakuna**, the Cocoon Pokémon\nKakuna remains virtually immobile as it clings to a tree. However, on the inside, it is extremely busy as it prepares for its coming evolution. This is evident from how hot the shell becomes to the touch."
  - "**Beedrill**, the Poison Bee Pokémon\nBeedrill is extremely territorial. No one should ever approach its nest—this is for their own safety. If angered, they will attack in a furious swarm."
  - "**Pidgey**, the Tiny Bird Pokémon\nPidgey has an extremely sharp sense of direction. It is capable of unerringly returning home to its nest, however far it may be removed from its familiar surroundings."
  - "**Pidgeotto**, the Bird Pokémon\nPidgeotto claims a large area as its own territory. This Pokémon flies around, patrolling its living space. If its territory is violated, it shows no mercy in thoroughly punishing the foe with its sharp claws."
  - "**Pidgeot**, the Bird Pokémon\nThis Pokémon has a dazzling plumage of beautifully glossy feathers. Many Trainers are captivated by the striking beauty of the feathers on its head, compelling them to choose Pidgeot as their Pokémon."
  - "**Rattata**, the Mouse Pokémon\nThis Pokémon is common but hazardous. Its sharp incisors can easily cut right through hard wood."
  - "**Raticate**, the Mouse Pokémon\nIts whiskers are essential for maintaining its balance. No matter how friendly you are, it will get angry and bite you if you touch its whiskers."
  - "**Spearow**, the Tiny Bird Pokémon\nDue to its short wings, it can’t fly long distances. It wanders about restlessly and pecks at bug Pokémon."
  - "**Fearow**, the Beak Pokémon\nIn Alola, fish Pokémon are its prey. It can be seen circling above the ocean searching for food."
  - "**Ekans**, the Snake Pokémon\nThe eggs of bird Pokémon are its favorite food. It swallows eggs whole, so sometimes an egg gets stuck, and Ekans faints."
  - "**Arbok**, the Cobra Pokémon\nAfter stunning its opponents with the pattern on its stomach, it quickly wraps them up in its body and waits for them to stop moving."
  - "**Pikachu**, the Mouse Pokémon\nWhile sleeping, it generates electricity in the sacs in its cheeks. If it’s not getting enough sleep, it will be able to use only weak electricity."
  - "**Raichu**, the Mouse Pokémon\nBecause so many Trainers like the way Pikachu looks, you don’t see this Pokémon very often."
  - "**Sandshrew**, the Mouse Pokémon\nWhen its skin gets wrinkled from moisture, it heads for a volcano. It lies flat on a spot with a lot of geothermal heat and dries itself out."
  - "**Sandslash**, the Mouse Pokémon\nThanks to its thick claws, it’s good at climbing trees. There are plenty of Sandslash that park themselves in trees and go right to sleep."
  - "**Nidoran♀**, the Poison Pin Pokémon\nNidoran♀ has barbs that secrete a powerful poison. They are thought to have developed as protection for this small-bodied Pokémon. When enraged, it releases a horrible toxin from its horn."
  - "**Nidorina**, the Poison Pin Pokémon\nWhen Nidorina are with their friends or family, they keep their barbs tucked away to prevent hurting each other. This Pokémon appears to become nervous if separated from the others."
  - "**Nidoqueen**, the Drill Pokémon\nNidoqueen’s body is encased in extremely hard scales. It is adept at sending foes flying with harsh tackles. This Pokémon is at its strongest when it is defending its young."
  - "**Nidoran♂**, the Poison Pin Pokémon\nNidoran♂ has developed muscles for moving its ears. Thanks to them, the ears can be freely moved in any direction. Even the slightest sound does not escape this Pokémon’s notice."
  - "**Nidorino**, the Poison Pin Pokémon\nNidorino has a horn that is harder than a diamond. If it senses a hostile presence, all the barbs on its back bristle up at once, and it challenges the foe with all its might."
  - "**Nidoking**, the Drill Pokémon\nNidoking’s thick tail packs enormously destructive power. With one swing, it can topple a metal transmission tower. Once this Pokémon goes on a rampage, there is no stopping it."
  - "**Clefairy**, the Fairy Pokémon\nBathed in moonlight, its wings glow faintly. Without even flapping, Clefairy rises into the air, where it dances around."
  - "**Clefable**, the Fairy Pokémon\nSome scientists believe that it gazes intently at the sky on nights with a full moon because it’s homesick."
  - "**Vulpix**, the Fox Pokémon\nIt manipulates balls of fire to catch its prey. If you raise one from when it’s young, it will grow close to you like a puppy Pokémon."
  - "**Ninetales**, the Fox Pokémon\nThe flickering flames it spews from its mouth leave its opponents hypnotized. Then, this extremely intelligent Pokémon attacks."
  - "**Jigglypuff**, the Balloon Pokémon\nThe songs they sing are totally different depending on the region they live in. Some even sound like they’re shouting!"
  - "**Wigglytuff**, the Balloon Pokémon\nWhen it gets angry, it inhales with all its might, and its body gradually inflates. Sometimes they can grow 20 times larger!"
  - "**Zubat**, the Bat Pokémon\nTheir skin is so thin that they’ll be burned if sunlight hits them. When it gets cold out, they gather together to warm one another’s bodies."
  - "**Golbat**, the Bat Pokémon\nThey can suck down over 10 ounces of blood in one go. They have been known to drink so much blood that they can no longer fly."
  - "**Oddish**, the Weed Pokémon\nOddish searches for fertile, nutrient-rich soil, then plants itself. During the daytime, while it is planted, this Pokémon’s feet are thought to change shape and become similar to the roots of trees."
  - "**Gloom**, the Weed Pokémon\nFrom its mouth Gloom drips honey that smells absolutely horrible. Apparently, it loves the horrid stench. It sniffs the noxious fumes and then drools even more of its honey."
  - "**Vileplume**, the Flower Pokémon\nVileplume has the world’s largest petals. They are used to attract prey that are then doused with toxic spores. Once the prey are immobilized, this Pokémon catches and devours them."
  - "**Paras**, the Mushroom Pokémon\nThe mushrooms, known as tochukaso, are controlling the bug. Even if the bug bugs the mushrooms, they tell it to bug off."
  - "**Parasect**, the Mushroom Pokémon\nIts poisonous spores are also used in traditional medicine. Apparently, spores produced in Alola are not of very good quality."
  - "**Venonat**, the Insect Pokémon\nVenonat is said to have evolved with a coat of thin, stiff hair that covers its entire body for protection. It possesses large eyes that never fail to spot even minuscule prey."
  - "**Venomoth**, the Poison Moth Pokémon\nVenomoth is nocturnal—it is a Pokémon that only becomes active at night. Its favorite prey are small insects that gather around streetlights, attracted by the light in the darkness."
  - "**Diglett**, the Mole Pokémon\nAround their crops, farmers plant the kind of tree that Diglett like to eat as a way of getting Diglett to plow the fields for them."
  - "**Dugtrio**, the Mole Pokémon\nDugtrio’s heads are sleek and smooth and incredibly hard. It can dig through any soil with its headbutts."
  - "**Meowth**, the Scratch Cat Pokémon\nIt loves coins, so if you give it one, you can make friends with Meowth easily. But it’s fickle, so you can’t count on that friendship lasting."
  - "**Persian**, the Classy Cat Pokémon\nThis Pokémon is popular with rich people. It’s also targeted by hunters who are after the jewel in its forehead."
  - "**Psyduck**, the Duck Pokémon\nIt has been found that its brain cells are 10 times more active when Psyduck is experiencing a headache."
  - "**Golduck**, the Duck Pokémon\nA professional swimmer, it can continue swimming for two days straight by waving its long tail skillfully."
  - "**Mankey**, the Pig Monkey Pokémon\nIf one gets angry, all the others around it will get angry, so silence is a rare visitor in a troop of Mankey."
  - "**Primeape**, the Pig Monkey Pokémon\nThe blood vessels in its brain are sturdier than those of other Pokémon, so it can stay healthy despite its constant raging."
  - "**Growlithe**, the Puppy Pokémon\nIt has lived alongside humans since ages ago. Its bones have been found in excavations of ruins from the Stone Age."
  - "**Arcanine**, the Legendary Pokémon\nThere are so many old tales about them that they’re called legendary Pokémon, but there are way more of them around than you’d expect."
  - "**Poliwag**, the Tadpole Pokémon\nThe direction of the swirl on their stomachs differs depending on where they live. Poliwag aficionados can tell them apart at a glance."
  - "**Poliwhirl**, the Tadpole Pokémon\nIts health suffers when its skin dries out, so be sure to moisturize it diligently."
  - "**Poliwrath**, the Tadpole Pokémon\nThe muscles it has developed through swimming are thick and powerful. When it lands a square punch, it can turn huge boulders to dust."
  - "**Abra**, the Psi Pokémon\nIt can read others’ minds and will teleport away when danger approaches. You must clear your mind if you want to catch it."
  - "**Kadabra**, the Psi Pokémon\nIt possesses strong mental capabilities, but its psychic powers are halved when it’s not holding a silver spoon."
  - "**Alakazam**, the Psi Pokémon\nIf it trusts someone deeply, it will let them have one of its spoons. Anything you eat with that spoon is apparently delicious."
  - "**Machop**, the Superpower Pokémon\nIt likes food that’s highly nutritious because its instincts drive it to build muscle efficiently."
  - "**Machoke**, the Superpower Pokémon\nA popular motif for sculptures, its incredibly well-developed muscles have captured the imagination of many an artist."
  - "**Machamp**, the Superpower Pokémon\nWith four arms, it can attack and defend simultaneously. It’s said to have mastered every martial art in the world."
  - "**Bellsprout**, the Flower Pokémon\nBellsprout’s thin and flexible body lets it bend and sway to avoid any attack, however strong it may be. From its mouth, this Pokémon spits a corrosive fluid that melts even iron."
  - "**Weepinbell**, the Flycatcher Pokémon\nWeepinbell has a large hook on its rear end. At night, the Pokémon hooks on to a tree branch and goes to sleep. If it moves around in its sleep, it may wake up to find itself on the ground."
  - "**Victreebel**, the Flycatcher Pokémon\nVictreebel has a long vine that extends from its head. This vine is waved and flicked about as if it were an animal to attract prey. When an unsuspecting prey draws near, this Pokémon swallows it whole."
  - "**Tentacool**, the Jellyfish Pokémon\nIts body is 99% water. The remaining 1% contains the organ that makes its poison."
  - "**Tentacruel**, the Jellyfish Pokémon\nIt communicates with others of its kind by lighting up the red orbs on its head. When the orbs are blinking, it’s a warning sign."
  - "**Geodude**, the Rock Pokémon\nIt uses both hands to climb precipitous cliffs. People who see it in action have been known to take up bouldering."
  - "**Graveler**, the Rock Pokémon\nIt travels by rolling down cliffs. If it falls into a river, it will explode with its last gasp."
  - "**Golem**, the Megaton Pokémon\nIt detonates its own body. The power from that explosion can propel it up steep mountain paths with amazing speed."
  - "**Ponyta**, the Fire Horse Pokémon\nPonyta is very weak at birth. It can barely stand up. This Pokémon becomes stronger by stumbling and falling to keep up with its parent."
  - "**Rapidash**, the Fire Horse Pokémon\nRapidash usually can be seen casually cantering in the fields and plains. However, when this Pokémon turns serious, its fiery manes flare and blaze as it gallops its way up to 150 mph."
  - "**Slowpoke**, the Dopey Pokémon\nAlthough their tails, which fall off naturally, can easily be found lying around, they’re a precious ingredient for cooking."
  - "**Slowbro**, the Hermit Crab Pokémon\nShellder, in its greed to suck out more and more sweetness from Slowbro’s tail, has metamorphosed into a spiral-shaped shell."
  - "**Magnemite**, the Magnet Pokémon\nPerhaps because electrical lines are often buried these days, the number of Magnemite attacks on power plants has increased."
  - "**Magneton**, the Magnet Pokémon\nWhen rain clouds form, many Magneton gather in high places to wait for lightning to strike."
  - "**Farfetch'd**, the Wild Duck Pokémon\nFarfetch’d is always seen with a stalk from a plant of some sort. Apparently, there are good stalks and bad stalks. This Pokémon has been known to fight with others over stalks."
  - "**Doduo**, the Twin Bird Pokémon\nDoduo’s two heads contain completely identical brains. A scientific study reported that on rare occasions, there will be examples of this Pokémon possessing different sets of brains."
  - "**Dodrio**, the Triple Bird Pokémon\nApparently, the heads aren’t the only parts of the body that Dodrio has three of. It has three sets of hearts and lungs as well, so it is capable of running long distances without rest."
  - "**Seel**, the Sea Lion Pokémon\nThanks to its thick fat, cold seas don’t bother it at all, but it gets tired pretty easily in warm waters."
  - "**Dewgong**, the Sea Lion Pokémon\nIt sunbathes on the beach after meals. The rise in its body temperature helps its digestion."
  - "**Grimer**, the Sludge Pokémon\nThe wastewater coming from factories is clean these days, so Grimer have nothing to eat. They’re said to be on the verge of extinction."
  - "**Muk**, the Sludge Pokémon\nBecause they scatter germs everywhere, they’ve long been targeted for extermination, leading to a steep decline in their population."
  - "**Shellder**, the Bivalve Pokémon\nEven when its shell is closed, its tongue still hangs out. If you give its tongue a good yank, the shock will cause Shellder to open its shell."
  - "**Cloyster**, the Bivalve Pokémon\nSlowpoke tails are its favorite food. It has even been known to come up on land to look for Slowpoke from time to time."
  - "**Gastly**, the Gas Pokémon\nPoisonous gas comprises 95% of its body. It’s said that the remaining 5% is made up of the souls of those who died from the gas."
  - "**Haunter**, the Gas Pokémon\nIt’s dangerous to go outside alone on nights when you’re feeling sad. Haunter will catch you, and you won’t be able to go back home."
  - "**Gengar**, the Shadow Pokémon\nEven your home isn’t safe. Gengar will lurk in whatever dark corner of a room it can find and wait for its chance to catch its prey."
  - "**Onix**, the Rock Snake Pokémon\nOnix has a magnet in its brain. It acts as a compass so that this Pokémon does not lose direction while it is tunneling. As it grows older, its body becomes increasingly rounder and smoother."
  - "**Drowzee**, the Hypnosis Pokémon\nIt puts its prey to sleep and devours their dreams. It seems that bad dreams taste sour, so Drowzee doesn’t particularly like eating them."
  - "**Hypno**, the Hypnosis Pokémon\nThere are some Hypno that assist doctors with patients who can’t sleep at night in hospitals."
  - "**Krabby**, the River Crab Pokémon\nKrabby live on beaches, burrowed inside holes dug into the sand. On sandy beaches with little in the way of food, these Pokémon can be seen squabbling with each other over territory."
  - "**Kingler**, the Pincer Pokémon\nKingler has an enormous, oversized claw. It waves this huge claw in the air to communicate with others. However, because the claw is so heavy, the Pokémon quickly tires."
  - "**Voltorb**, the Ball Pokémon\nVoltorb is extremely sensitive—it explodes at the slightest of shocks. It is rumored that it was first created when a Poké Ball was exposed to a powerful pulse of energy."
  - "**Electrode**, the Ball Pokémon\nOne of Electrode’s characteristics is its attraction to electricity. It is a problematical Pokémon that congregates mostly at electrical power plants to feed on electricity that has just been generated."
  - "**Exeggcute**, the Egg Pokémon\nAlthough they are the same size as other Exeggcute, the ones produced in Alola are quite heavy. Their shells are packed full."
  - "**Exeggutor**, the Coconut Pokémon\nEach of its three heads has its own thoughts. When they want to go in different directions, Exeggutor becomes unable to move."
  - "**Cubone**, the Lonely Pokémon\nIt wears its mother’s skull on its head, so no one knows what its bare face looks like. However, it’s clear that it’s always crying."
  - "**Marowak**, the Bone Keeper Pokémon\nThey thump their bones rhythmically to communicate among themselves. There are nearly 50 different rhythmic patterns."
  - "**Hitmonlee**, the Kicking Pokémon\nHitmonlee’s legs freely contract and stretch. Using these springlike legs, it bowls over foes with devastating kicks. After battle, it rubs down its legs and loosens the muscles to overcome fatigue."
  - "**Hitmonchan**, the Punching Pokémon\nHitmonchan is said to possess the spirit of a boxer who had been working toward a world championship. This Pokémon has an indomitable spirit and will never give up in the face of adversity."
  - "**Lickitung**, the Licking Pokémon\nIt licks filth clean with its tongue. Whatever it licks always stinks afterward, so whether it’s really clean is...questionable."
  - "**Koffing**, the Poison Gas Pokémon\nKoffing embodies toxic substances. It mixes the toxins with raw garbage to set off a chemical reaction that results in a terribly powerful poison gas. The higher the temperature, the more gas is concocted by this Pokémon."
  - "**Weezing**, the Poison Gas Pokémon\nWeezing alternately shrinks and inflates its twin bodies to mix together toxic gases inside. The more the gases are mixed, the more powerful the toxins become. The Pokémon also becomes more putrid."
  - "**Rhyhorn**, the Spikes Pokémon\nRhyhorn’s brain is very small. It is so dense, while on a run it forgets why it started running in the first place. It apparently remembers sometimes if it demolishes something."
  - "**Rhydon**, the Drill Pokémon\nRhydon has a horn that serves as a drill. It is used for destroying rocks and boulders. This Pokémon occasionally rams into streams of magma, but the armor-like hide prevents it from feeling the heat."
  - "**Chansey**, the Egg Pokémon\nBecause the eggs on their bellies have been overharvested by people in the past, the Chansey population remains very small."
  - "**Tangela**, the Vine Pokémon\nTangela’s vines snap off easily if they are grabbed. This happens without pain, allowing it to make a quick getaway. The lost vines are replaced by newly grown vines the very next day."
  - "**Kangaskhan**, the Parent Pokémon\nYou shouldn’t get close to the child when it’s playing outside its mother’s pouch. Its mother is always nearby watching over it."
  - "**Horsea**, the Dragon Pokémon\nIf Horsea senses danger, it will reflexively spray a dense black ink from its mouth and try to escape. This Pokémon swims by cleverly flapping the fin on its back."
  - "**Seadra**, the Dragon Pokémon\nSeadra generates whirlpools by spinning its body. The whirlpools are strong enough to swallow even fishing boats. This Pokémon weakens prey with these currents, then swallows it whole."
  - "**Goldeen**, the Goldfish Pokémon\nThe way it swims along fluttering its dress-like fins has earned it the name “princess of the water.”"
  - "**Seaking**, the Goldfish Pokémon\nTo attract females, males dance on the river’s floor. The females gather around the male that dances most gracefully."
  - "**Staryu**, the Star Shape Pokémon\nNo number of injuries can bother Staryu. Its amazing regenerative powers return it to its previous state in half a day!"
  - "**Starmie**, the Mysterious Pokémon\nIt rotates its geometrically shaped body to swim through the water. It always seems to be sending out mysterious radio waves."
  - "**Mr. Mime**, the Barrier Pokémon\nIt creates invisible walls with its pantomiming. If you don’t act impressed, it will attack you with a double slap!"
  - "**Scyther**, the Mantis Pokémon\nSome call it a ninja. Its movements— imperceptibly quick—are sufficient to cleave the air in two. It’s very popular in Alola."
  - "**Jynx**, the Human Shape Pokémon\nIts strange cries sound like human language. There are some musicians who compose songs for Jynx to sing."
  - "**Electabuzz**, the Electric Pokémon\nWhile it’s often blamed for power outages, the truth is the cause of outages is more often an error on the part of the electric company."
  - "**Magmar**, the Spitfire Pokémon\nThe hotter the place, the better they feel. Magmar in Alola are said to be hardier than those in other areas."
  - "**Pinsir**, the Stag Beetle Pokémon\nAlthough it’s tough, it can’t handle cold well. When night falls, it buries itself in leafage and sleeps."
  - "**Tauros**, the Wild Bull Pokémon\nThe climate seems to be related to the reason Tauros in Alola are a little calmer than those in other regions."
  - "**Magikarp**, the Fish Pokémon\nThanks to their strong hold on life, dirty water doesn’t bother them at all. They live in waters all over the world!"
  - "**Gyarados**, the Atrocious Pokémon\nThe energy from evolution stimulated its brain cells strongly, causing it to become very ferocious."
  - "**Lapras**, the Transport Pokémon\nThey’ve been so cherished that there’s now an overabundance. The fish Pokémon population has declined in waters with too many Lapras."
  - "**Ditto**, the Transform Pokémon\nIt transforms into whatever it sees. If the thing it’s transforming into isn’t right in front of it, Ditto relies on its memory—so sometimes it fails."
  - "**Eevee**, the Evolution Pokémon\nIts genes are easily influenced by its surroundings. Even its face starts to look like that of its Trainer."
  - "**Vaporeon**, the Bubble Jet Pokémon\nIt detects nearby moisture with its fin. When its fin begins trembling rapidly, that means rain will fall in a few hours."
  - "**Jolteon**, the Lightning Pokémon\nIts fur stands on end, becoming like needles it fires at enemies. Once they’re weakened, it finishes them off with a 10,000 volt shock."
  - "**Flareon**, the Flame Pokémon\nThe flame chamber inside its body ignites when Flareon gets agitated, reaching temperatures of up to 1,650 degrees Fahrenheit."
  - "**Porygon**, the Virtual Pokémon\nIt was built 20 years ago by scientists who dreamed of exploring space. Their dreams have yet to come true."
  - "**Omanyte**, the Spiral Pokémon\nIt was restored from an ancient fossil. Those Helix Fossils are excavated from areas that were once oceans long, long ago."
  - "**Omastar**, the Spiral Pokémon\nIt wraps its prey in its tentacles to immobilize them and then finishes them off with its sharp fangs."
  - "**Kabuto**, the Shellfish Pokémon\nThis Pokémon became extinct everywhere, except in a few areas. It protects itself with its hard shell."
  - "**Kabutops**, the Shellfish Pokémon\nIt swims at speeds of roughly 29 knots, quickly closing in on its prey and slashing into them with its scythes to finish them off."
  - "**Aerodactyl**, the Fossil Pokémon\nIt flew through the open skies over the ancient continent as if they were its own. When it touched ground, its walk was weak and slow."
  - "**Snorlax**, the Sleeping Pokémon\nIt has no interest in anything other than eating. Even if you climb up on its stomach while it’s napping, it doesn’t seem to mind at all!"
  - "**Articuno**, the Freeze Pokémon\nArticuno is a legendary bird Pokémon that can control ice. The flapping of its wings chills the air. As a result, it is said that when this Pokémon flies, snow will fall."
  - "**Zapdos**, the Electric Pokémon\nZapdos is a legendary bird Pokémon that has the ability to control electricity. It usually lives in thunderclouds. The Pokémon gains power if it is stricken by lightning bolts."
  - "**Moltres**, the Flame Pokémon\nMoltres is a legendary bird Pokémon that has the ability to control fire. If this Pokémon is injured, it is said to dip its body in the molten magma of a volcano to burn and heal itself."
  - "**Dratini**, the Dragon Pokémon\nIt sheds its skin—almost on a daily basis—and grows larger. Its skin is soft just after it’s been shed."
  - "**Dragonair**, the Dragon Pokémon\nSome say that if you see it at the start of the year, flying through the sky and twisting its body, you’ll be healthy all year long."
  - "**Dragonite**, the Dragon Pokémon\nYou’ll often hear tales of this kindhearted Pokémon rescuing people or Pokémon that are drowning."
  - "**Mewtwo**, the Genetic Pokémon\nMewtwo is a Pokémon that was created by genetic manipulation. However, even though the scientific power of humans created this Pokémon’s body, they failed to endow Mewtwo with a compassionate heart."
  - "**Mew**, the New Species Pokémon\nMew is said to possess the genetic composition of all Pokémon. It is capable of making itself invisible at will, so it entirely avoids notice even if it approaches people."
  - "**Chikorita**, the Leaf Pokémon\nIn battle, Chikorita waves its leaf around to keep the foe at bay. However, a sweet fragrance also wafts from the leaf, becalming the battling Pokémon and creating a cozy, friendly atmosphere all around."
  - "**Bayleef**, the Leaf Pokémon\nBayleef’s neck is ringed by curled-up leaves. Inside each tubular leaf is a small shoot of a tree. The fragrance of this shoot makes people peppy."
  - "**Meganium**, the Herb Pokémon\nThe fragrance of Meganium’s flower soothes and calms emotions. In battle, this Pokémon gives off more of its becalming scent to blunt the foe’s fighting spirit."
  - "**Cyndaquil**, the Fire Mouse Pokémon\nCyndaquil protects itself by flaring up the flames on its back. The flames are vigorous if the Pokémon is angry. However, if it is tired, the flames splutter fitfully with incomplete combustion."
  - "**Quilava**, the Volcano Pokémon\nQuilava keeps its foes at bay with the intensity of its flames and gusts of superheated air. This Pokémon applies its outstanding nimbleness to dodge attacks even while scorching the foe with flames."
  - "**Typhlosion**, the Volcano Pokémon\nTyphlosion obscures itself behind a shimmering heat haze that it creates using its intensely hot flames. This Pokémon creates blazing explosive blasts that burn everything to cinders."
  - "**Totodile**, the Big Jaw Pokémon\nDespite the smallness of its body, Totodile’s jaws are very powerful. While the Pokémon may think it is just playfully nipping, its bite has enough power to cause serious injury."
  - "**Croconaw**, the Big Jaw Pokémon\nOnce Croconaw has clamped its jaws on its foe, it will absolutely not let go. Because the tips of its fangs are forked back like barbed fishhooks, they become impossible to remove when they have sunk in."
  - "**Feraligatr**, the Big Jaw Pokémon\nFeraligatr intimidates its foes by opening its huge mouth. In battle, it will kick the ground hard with its thick and powerful hind legs to charge at the foe at an incredible speed."
  - "**Sentret**, the Scout Pokémon\nWhen Sentret sleeps, it does so while another stands guard. The sentry wakes the others at the first sign of danger. When this Pokémon becomes separated from its pack, it becomes incapable of sleep due to fear."
  - "**Furret**, the Long Body Pokémon\nFurret has a very slim build. When under attack, it can slickly squirm through narrow spaces and get away. In spite of its short limbs, this Pokémon is very nimble and fleet."
  - "**Hoothoot**, the Owl Pokémon\nIt cries out at the same time every day. A long time ago, people cherished it and considered it a divine messenger sent to tell the time."
  - "**Noctowl**, the Owl Pokémon\nWhen it turns its head entirely upside down, you know it’s troubled by something. If you don’t leave it be, it will peck you."
  - "**Ledyba**, the Five Star Pokémon\nThese very cowardly Pokémon join together and use Reflect to protect their nest."
  - "**Ledian**, the Five Star Pokémon\nIt flies through the night sky, sprinkling sparkly dust. According to some, if that dust sticks to you, good things will happen to you."
  - "**Spinarak**, the String Spit Pokémon\nAlthough the poison from its fangs isn’t that strong, it’s potent enough to weaken prey that gets caught in its web."
  - "**Ariados**, the Long Leg Pokémon\nIt spews threads from its mouth to catch its prey. When night falls, it leaves its web to go hunt aggressively."
  - "**Crobat**, the Bat Pokémon\nIt feeds on the blood of living people and Pokémon. If it can’t drink any blood for even a short while, it becomes weak and unable to fly."
  - "**Chinchou**, the Angler Pokémon\nChinchou blink their shining antennae at one another to claim their respective turf."
  - "**Lanturn**, the Light Pokémon\nIt lives far down in the depths of the ocean. It blinds its prey with light, using the moment they’re dazzled to swallow them whole."
  - "**Pichu**, the Tiny Mouse Pokémon\nIt has electric sacs in its cheeks. When they’re fully charged, Pichu plays very energetically."
  - "**Cleffa**, the Star Shape Pokémon\nSaid to have ridden here on a shooting star, Cleffa seem to appear in places where meteorites have struck in the past."
  - "**Igglybuff**, the Balloon Pokémon\nLeft to its own devices, it will constantly practice singing. You should make it take a break so it doesn’t hurt its throat."
  - "**Togepi**, the Spike Ball Pokémon\nAs its energy, Togepi uses the positive emotions of compassion and pleasure exuded by people and Pokémon. This Pokémon stores up feelings of happiness inside its shell, then shares them with others."
  - "**Togetic**, the Happiness Pokémon\nTogetic is said to be a Pokémon that brings good fortune. When the Pokémon spots someone who is pure of heart, it is said to appear and share its happiness with that person."
  - "**Natu**, the Tiny Bird Pokémon\nThe look in its eyes gives the impression that it’s carefully observing you. If you approach it, Natu will hop away."
  - "**Xatu**, the Mystic Pokémon\nWhile it can see the future, it has no desire to change it, which is probably why it remains motionless at all times."
  - "**Mareep**, the Wool Pokémon\nRubbing its fleece generates electricity. You’ll want to pet it because it’s cute, but if you use your bare hand, you’ll get a painful shock."
  - "**Flaaffy**, the Wool Pokémon\nIt stores electricity in its fluffy fleece. If it stores up too much, it will start to go bald in those patches."
  - "**Ampharos**, the Light Pokémon\nIts tail shines bright and strong. It has been prized since long ago as a beacon for sailors."
  - "**Bellossom**, the Flower Pokémon\nA Bellossom grows flowers more beautifully if it has evolved from a smelly Gloom—the more stinky the better. At night, this Pokémon closes its petals and goes to sleep."
  - "**Marill**, the Aqua Mouse Pokémon\nWhen fishing for food at the edge of a fast-running stream, Marill wraps its tail around the trunk of a tree. This Pokémon’s tail is flexible and configured to stretch."
  - "**Azumarill**, the Aqua Rabbit Pokémon\nAzumarill can make balloons out of air. It makes these air balloons if it spots a drowning Pokémon. The air balloons enable the Pokémon in trouble to breathe."
  - "**Sudowoodo**, the Imitation Pokémon\nThe result of its holding the same pose all the time is arms that have become supple yet strong."
  - "**Politoed**, the Frog Pokémon\nThe longer and more luxurious the curled hair on its head, the greater the number of Poliwag and Poliwhirl that will obey it."
  - "**Hoppip**, the Cottonweed Pokémon\nThis Pokémon drifts and floats with the wind. If it senses the approach of strong winds, Hoppip links its leaves with other Hoppip to prepare against being blown away."
  - "**Skiploom**, the Cottonweed Pokémon\nSkiploom’s flower blossoms when the temperature rises above 64 degrees Fahrenheit. How much the flower opens depends on the temperature. For that reason, this Pokémon is sometimes used as a thermometer."
  - "**Jumpluff**, the Cottonweed Pokémon\nJumpluff rides warm southern winds to cross the sea and fly to foreign lands. The Pokémon descends to the ground when it encounters cold air while it is floating."
  - "**Aipom**, the Long Tail Pokémon\nIt searches for prey from the tops of trees. When it spots its favorite food, Bounsweet, Aipom gets excited and pounces."
  - "**Sunkern**, the Seed Pokémon\nSunkern tries to move as little as it possibly can. It does so because it tries to conserve all the nutrients it has stored in its body for its evolution. It will not eat a thing, subsisting only on morning dew."
  - "**Sunflora**, the Sun Pokémon\nSunflora converts solar energy into nutrition. It moves around actively in the daytime when it is warm. It stops moving as soon as the sun goes down for the night."
  - "**Yanma**, the Clear Wing Pokémon\nYanma is capable of seeing 360 degrees without having to move its eyes. It is a great flier that is adept at making sudden stops and turning midair. This Pokémon uses its flying ability to quickly chase down targeted prey."
  - "**Wooper**, the Water Fish Pokémon\nWooper usually lives in water. However, it occasionally comes out onto land in search of food. On land, it coats its body with a gooey, toxic film."
  - "**Quagsire**, the Water Fish Pokémon\nQuagsire hunts for food by leaving its mouth wide open in water and waiting for its prey to blunder in unaware. Because the Pokémon does not move, it does not get very hungry."
  - "**Espeon**, the Sun Pokémon\nPsychic power builds up in the orb on its forehead as it bathes in the sunshine. Espeon is not good at battling at night."
  - "**Umbreon**, the Moonlight Pokémon\nIt lurks in the dark of night looking for prey. At the moment it pounces, the rings on its body glow dimly but ominously."
  - "**Murkrow**, the Darkness Pokémon\nIt searches for shiny things for its boss. Murkrow’s presence is said to be unlucky, so many people detest it."
  - "**Slowking**, the Royal Pokémon\nIt’s called “the sage of the sea.” It engages in battles of wits with Oranguru, but the result is usually a draw."
  - "**Misdreavus**, the Screech Pokémon\nWhat makes it happy is imitating the voices of weeping people and scaring everyone. It doesn’t deal well with folks who aren’t easily frightened."
  - "**Unown**, the Symbol Pokémon\nThis Pokémon is shaped like ancient writing. It is a mystery as to which came first, the ancient writings or the various Unown. Research into this topic is ongoing but nothing is known."
  - "**Wobbuffet**, the Patient Pokémon\nWobbuffet does nothing but endure attacks—it won’t attack on its own. However, it won’t endure an attack on its tail. When that happens, the Pokémon will try to take the foe with it using Destiny Bond."
  - "**Girafarig**, the Long Neck Pokémon\nGirafarig’s rear head contains a tiny brain that is too small for thinking. However, the rear head doesn’t need to sleep, so it can keep watch over its surroundings 24 hours a day."
  - "**Pineco**, the Bagworm Pokémon\nIt sticks tree bark to itself with its saliva, making itself thicker and larger. Elderly Pineco are ridiculously huge."
  - "**Forretress**, the Bagworm Pokémon\nIn the moment that it gulps down its prey, the inside of its shell is exposed, but to this day, no one has ever seen that sight."
  - "**Dunsparce**, the Land Snake Pokémon\nWhen it sees a person, it digs a hole with its tail to make its escape. If you happen to find one, consider yourself lucky."
  - "**Gligar**, the Fly Scorpion Pokémon\nGligar glides through the air without a sound as if it were sliding. This Pokémon hangs on to the face of its foe using its clawed hind legs and the large pincers on its forelegs, then injects the prey with its poison barb."
  - "**Steelix**, the Iron Snake Pokémon\nSteelix lives even further underground than Onix. This Pokémon is known to dig toward the earth’s core. There are records of this Pokémon reaching a depth of over six-tenths of a mile underground."
  - "**Snubbull**, the Fairy Pokémon\nIn contrast to its appearance, it’s quite timid. When playing with other puppy Pokémon, it sometimes gets bullied."
  - "**Granbull**, the Fairy Pokémon\nAlthough it’s popular with young people, Granbull is timid and sensitive, so it’s totally incompetent as a watchdog."
  - "**Qwilfish**, the Balloon Pokémon\nQwilfish sucks in water, inflating itself. This Pokémon uses the pressure of the water it swallowed to shoot toxic quills all at once from all over its body. It finds swimming somewhat challenging."
  - "**Scizor**, the Pincer Pokémon\nOnce it has identified something as an enemy, it will continue beating them with its steel-hard pincers until there’s nothing left but scraps."
  - "**Shuckle**, the Mold Pokémon\nShuckle quietly hides itself under rocks, keeping its body concealed inside its hard shell while eating berries it has stored away. The berries mix with its body fluids to become a juice."
  - "**Heracross**, the Single Horn Pokémon\nIt roams through forests searching for sweet nectar. Although it boasts fantastic physical strength, it’s not that good at flying."
  - "**Sneasel**, the Sharp Claw Pokémon\nIt blends into the dark of night to ambush its prey. Sneasel will attack Sandshrew, but its hard skin can cause Sneasel’s claws to snap off."
  - "**Teddiursa**, the Little Bear Pokémon\nThis Pokémon likes to lick its palms that are sweetened by being soaked in honey. Teddiursa concocts its own honey by blending fruits and pollen collected by Beedrill."
  - "**Ursaring**, the Hibernator Pokémon\nIn the forests inhabited by Ursaring, it is said that there are many streams and towering trees where they gather food. This Pokémon walks through its forest gathering food every day."
  - "**Slugma**, the Lava Pokémon\nSlugma does not have any blood in its body. Instead, intensely hot magma circulates throughout this Pokémon’s body, carrying essential nutrients and oxygen to its organs."
  - "**Magcargo**, the Lava Pokémon\nMagcargo’s body temperature is approximately 18,000 degrees Fahrenheit. Water is vaporized on contact. If this Pokémon is caught in the rain, the raindrops instantly turn into steam, cloaking the area in a thick fog."
  - "**Swinub**, the Pig Pokémon\nSwinub roots for food by rubbing its snout against the ground. Its favorite food is a mushroom that grows under the cover of dead grass. This Pokémon occasionally roots out hot springs."
  - "**Piloswine**, the Swine Pokémon\nPiloswine is covered by a thick coat of long hair that enables it to endure the freezing cold. This Pokémon uses its tusks to dig up food that has been buried under ice."
  - "**Corsola**, the Coral Pokémon\nIn Alola, where their natural enemies Mareanie are plentiful, many Corsola have stubby branches on their heads."
  - "**Remoraid**, the Jet Pokémon\nAlso known as the “sniper of the seas,” its water gun can hit prey without fail from over 300 feet away."
  - "**Octillery**, the Jet Pokémon\nIt usually sleeps in caves. The pitch-black ink that Octillery spits is also used for cooking."
  - "**Delibird**, the Delivery Pokémon\nIt wraps food in its tail to carry it around. The Delibird with the biggest tail is the boss of the flock!"
  - "**Mantine**, the Kite Pokémon\nMany people have taken up surfing because they admire how magnificently Mantine swims."
  - "**Skarmory**, the Armor Bird Pokémon\nIts body is draped in steel armor. It looks heavy, but it can fly at speeds of up to 185 miles an hour!"
  - "**Houndour**, the Dark Pokémon\nThey make repeated eerie howls before dawn to call attention to their pack."
  - "**Houndoom**, the Dark Pokémon\nIdentifiable by its eerie howls, people a long time ago thought it was the grim reaper and feared it."
  - "**Kingdra**, the Dragon Pokémon\nKingdra sleeps on the seafloor where it is otherwise devoid of life. When a storm arrives, the Pokémon is said to awaken and wander about in search of prey."
  - "**Phanpy**, the Long Nose Pokémon\nPhanpy uses its long nose to shower itself. When others gather around, they thoroughly douse each other with water. These Pokémon can be seen drying their soaking-wet bodies at the edge of water."
  - "**Donphan**, the Armor Pokémon\nIf Donphan were to tackle with its hard body, even a house could be destroyed. Using its massive strength, the Pokémon helps clear rock and mud slides that block mountain trails."
  - "**Porygon2**, the Virtual Pokémon\nEven though it doesn’t die in the vacuum of space, it can’t move around very well in zero gravity."
  - "**Stantler**, the Big Horn Pokémon\nStantler’s magnificent antlers were traded at high prices as works of art. As a result, this Pokémon was hunted close to extinction by those who were after the priceless antlers."
  - "**Smeargle**, the Painter Pokémon\nIt draws symbols with the fluid that oozes from the tip of its tail. Depending on the symbol, Smeargle fanatics will pay big money for them."
  - "**Tyrogue**, the Scuffle Pokémon\nTyrogue becomes stressed out if it does not get to train every day. When raising this Pokémon, the Trainer must establish and uphold various training methods."
  - "**Hitmontop**, the Handstand Pokémon\nHitmontop spins on its head at high speed, all the while delivering kicks. This technique is a remarkable mix of both offense and defense at the same time. The Pokémon travels faster spinning than it does walking."
  - "**Smoochum**, the Kiss Pokémon\nHighly perceptive sensors, Smoochum’s lips are kept moist by its daily application of tree sap."
  - "**Elekid**, the Electric Pokémon\nWhen its horns shine a bluish white, that’s the sign it’s fully charged. You’ll get a shocking jolt if you touch it!"
  - "**Magby**, the Live Coal Pokémon\nIts body temperature is always around 1,100 degrees Fahrenheit. If Magby falls into a small- enough pond, the whole thing will dry up."
  - "**Miltank**, the Milk Cow Pokémon\nIts milk is delicious and chock-full of nutrients. However, if you drink too much, it could make your stomach hurt, so be careful."
  - "**Blissey**, the Happiness Pokémon\nThis Pokémon is overflowing with love. Only Chansey that share a strong bond with their Trainer can evolve, so people say."
  - "**Raikou**, the Thunder Pokémon\nRaikou embodies the speed of lightning. The roars of this Pokémon send shock waves shuddering through the air and shake the ground as if lightning bolts had come crashing down."
  - "**Entei**, the Volcano Pokémon\nEntei embodies the passion of magma. This Pokémon is thought to have been born in the eruption of a volcano. It sends up massive bursts of fire that utterly consume all that they touch."
  - "**Suicune**, the Aurora Pokémon\nSuicune embodies the compassion of a pure spring of water. It runs across the land with gracefulness. This Pokémon has the power to purify dirty water."
  - "**Larvitar**, the Rock Skin Pokémon\nRaised on nutrients it finds in the dirt, it eats roughly a mountain’s worth of dirt before it becomes a pupa."
  - "**Pupitar**, the Hard Shell Pokémon\nThis dangerous pupa thrashes about. Its shell is as hard as bedrock, containing its gradually forming new body within."
  - "**Tyranitar**, the Armor Pokémon\nThis Pokémon is a mobile disaster, leaving mountains crumbled and houses destroyed in its wake."
  - "**Lugia**, the Diving Pokémon\nLugia’s wings pack devastating power—a light fluttering of its wings can blow apart regular houses. As a result, this Pokémon chooses to live out of sight deep under the sea."
  - "**Ho-Oh**, the Rainbow Pokémon\nHo-Oh’s feathers glow in seven colors depending on the angle at which they are struck by light. These feathers are said to bring happiness to the bearers. This Pokémon is said to live at the foot of a rainbow."
  - "**Celebi**, the Time Travel Pokémon\nThis Pokémon came from the future by crossing over time. It is thought that so long as Celebi appears, a bright and shining future awaits us."
  - "**Treecko**, the Wood Gecko Pokémon\nTreecko is cool, calm, and collected—it never panics under any situation. If a bigger foe were to glare at this Pokémon, it would glare right back without conceding an inch of ground."
  - "**Grovyle**, the Wood Gecko Pokémon\nThis Pokémon adeptly flies from branch to branch in trees. In a forest, no Pokémon can ever hope to catch a fleeing Grovyle however fast they may be."
  - "**Sceptile**, the Forest Pokémon\nSceptile has seeds growing on its back. They are said to be bursting with nutrients that revitalize trees. This Pokémon raises the trees in a forest with loving care."
  - "**Torchic**, the Chick Pokémon\nTorchic has a place inside its body where it keeps its flame. Give it a hug—it will be glowing with warmth. This Pokémon is covered all over by a fluffy coat of down."
  - "**Combusken**, the Young Fowl Pokémon\nCombusken battles with the intensely hot flames it spews from its beak and with outstandingly destructive kicks. This Pokémon’s cry is very loud and distracting."
  - "**Blaziken**, the Blaze Pokémon\nBlaziken has incredibly strong legs—it can easily clear a 30-story building in one leap. This Pokémon’s blazing punches leave its foes scorched and blackened."
  - "**Mudkip**, the Mud Fish Pokémon\nIn water, Mudkip breathes using the gills on its cheeks. If it is faced with a tight situation in battle, this Pokémon will unleash its amazing power—it can crush rocks bigger than itself."
  - "**Marshtomp**, the Mud Fish Pokémon\nMarshtomp is much faster at traveling through mud than it is at swimming. This Pokémon’s hindquarters exhibit obvious development, giving it the ability to walk on just its hind legs."
  - "**Swampert**, the Mud Fish Pokémon\nSwampert predicts storms by sensing subtle differences in the sounds of waves and tidal winds with its fins. If a storm is approaching, it piles up boulders to protect itself."
  - "**Poochyena**, the Bite Pokémon\nPoochyena is an omnivore—it will eat anything. A distinguishing feature is how large its fangs are compared to its body. This Pokémon tries to intimidate its foes by making the hair on its tail bristle out."
  - "**Mightyena**, the Bite Pokémon\nMightyena travel and act as a pack in the wild. The memory of its life in the wild compels the Pokémon to obey only those Trainers that it recognizes to possess superior skill."
  - "**Zigzagoon**, the Tiny Raccoon Pokémon\nThe hair on Zigzagoon’s back is bristly. It rubs the hard back hair against trees to leave its territorial markings. This Pokémon may play dead to fool foes in battle."
  - "**Linoone**, the Rushing Pokémon\nWhen hunting, Linoone will make a beeline straight for the prey at a full run. While this Pokémon is capable of topping 60 mph, it has to come to a screeching halt before it can turn."
  - "**Wurmple**, the Worm Pokémon\nWurmple is targeted by Swellow as prey. This Pokémon will try to resist by pointing the spikes on its rear at the attacking predator. It will weaken the foe by leaking poison from the spikes."
  - "**Silcoon**, the Cocoon Pokémon\nSilcoon was thought to endure hunger and not consume anything before its evolution. However, it is now thought that this Pokémon slakes its thirst by drinking rainwater that collects on its silk."
  - "**Beautifly**, the Butterfly Pokémon\nBeautifly has a long mouth like a coiled needle, which is very convenient for collecting pollen from flowers. This Pokémon rides the spring winds as it flits around gathering pollen."
  - "**Cascoon**, the Cocoon Pokémon\nIf it is attacked, Cascoon remains motionless however badly it may be hurt. It does so because if it were to move, its body would be weak upon evolution. This Pokémon will also not forget the pain it endured."
  - "**Dustox**, the Poison Moth Pokémon\nWhen Dustox flaps its wings, a fine dust is scattered all over. This dust is actually a powerful poison that will even make a pro wrestler sick. This Pokémon searches for food using its antennae like radar."
  - "**Lotad**, the Water Weed Pokémon\nLotad is said to have dwelled on land before. However, this Pokémon is thought to have returned to water because the leaf on its head grew large and heavy. It now lives by floating atop the water."
  - "**Lombre**, the Jolly Pokémon\nLombre’s entire body is covered by a slippery, slimy film. It feels horribly unpleasant to be touched by this Pokémon’s hands. Lombre is often mistaken for a human child."
  - "**Ludicolo**, the Carefree Pokémon\nUpon hearing an upbeat and cheerful rhythm, the cells in Ludicolo’s body become very energetic and active. Even in battle, this Pokémon will exhibit an amazing amount of power."
  - "**Seedot**, the Acorn Pokémon\nSeedot looks exactly like an acorn when it is dangling from a tree branch. It startles other Pokémon by suddenly moving. This Pokémon polishes its body once a day using leaves."
  - "**Nuzleaf**, the Wily Pokémon\nThis Pokémon pulls out the leaf on its head and makes a flute with it. The sound of Nuzleaf’s flute strikes fear and uncertainty in the hearts of people lost in a forest."
  - "**Shiftry**, the Wicked Pokémon\nShiftry’s large fans generate awesome gusts of wind at a speed close to 100 feet per second. The whipped-up wind blows anything away. This Pokémon chooses to live quietly deep in forests."
  - "**Taillow**, the Tiny Swallow Pokémon\nTaillow is young—it has only just left its nest. As a result, it sometimes becomes lonesome and cries at night. This Pokémon feeds on Wurmple that live in forests."
  - "**Swellow**, the Swallow Pokémon\nSwellow is very conscientious about the upkeep of its glossy wings. Once two Swellow are gathered, they diligently take care of cleaning each other’s wings."
  - "**Wingull**, the Seagull Pokémon\nIt builds nests in cliffs by the sea. It circles the skies above the ocean looking for its favorite food—Wishiwashi."
  - "**Pelipper**, the Water Bird Pokémon\nIt scoops up Wishiwashi in its huge beak and swallows them whole. It can devour more than 30 at one go!"
  - "**Ralts**, the Feeling Pokémon\nRalts has the ability to sense the emotions of people. If its Trainer is in a cheerful mood, this Pokémon grows cheerful and joyous in the same way."
  - "**Kirlia**, the Emotion Pokémon\nKirlia uses the horns on its head to amplify its psychokinetic power. When the Pokémon uses its power, the air around it becomes distorted, creating mirages of nonexistent scenery."
  - "**Gardevoir**, the Embrace Pokémon\nGardevoir has the psychokinetic power to distort the dimensions and create a small black hole. This Pokémon will try to protect its Trainer even at the risk of its own life."
  - "**Surskit**, the Pond Skater Pokémon\nIt lives in ponds and marshes that feature lots of plant life. It often fights with Dewpider, whose habitat and diet are similar."
  - "**Masquerain**, the Eyeball Pokémon\nIts thin, winglike antennae are highly absorbent. It waits out rainy days in tree hollows."
  - "**Shroomish**, the Mushroom Pokémon\nIf Shroomish senses danger, it shakes its body and scatters spores from the top of its head. This Pokémon’s spores are so toxic, they make trees and weeds wilt."
  - "**Breloom**, the Mushroom Pokémon\nThe seeds ringing Breloom’s tail are made of hardened toxic spores. It is horrible to eat the seeds. Just taking a bite of this Pokémon’s seed will cause your stomach to rumble."
  - "**Slakoth**, the Slacker Pokémon\nSlakoth’s heart beats just once a minute. Whatever happens, it is content to loaf around motionless. It is rare to see this Pokémon in motion."
  - "**Vigoroth**, the Wild Monkey Pokémon\nVigoroth is simply incapable of remaining still. Even when it tries to sleep, the blood in its veins grows agitated, compelling this Pokémon to run wild throughout the jungle before it can settle down."
  - "**Slaking**, the Lazy Pokémon\nWherever Slaking live, rings of over a yard in diameter appear in grassy fields. They are made by the Pokémon as it eats all the grass within reach while lying prone on the ground."
  - "**Nincada**, the Trainee Pokémon\nNincada lives underground. It uses its sharp claws to carve the roots of trees and absorb moisture and nutrients. This Pokémon can’t withstand bright sunlight so avoids it."
  - "**Ninjask**, the Ninja Pokémon\nIf Ninjask is not trained properly, it will refuse to obey the Trainer and cry loudly continuously. Because of this quality, this Pokémon is said to be one that puts the Trainer’s abilities to the test."
  - "**Shedinja**, the Shed Pokémon\nShedinja is a peculiar Pokémon. It seems to appear unsought in a Poké Ball after a Nincada evolves. This bizarre Pokémon is entirely immobile—it doesn’t even breathe."
  - "**Whismur**, the Whisper Pokémon\nWhismur is very timid. If it starts to cry loudly, it becomes startled by its own crying and cries even harder. When it finally stops crying, the Pokémon goes to sleep, all tired out."
  - "**Loudred**, the Big Voice Pokémon\nLoudred shouts while stamping its feet. After it finishes shouting, this Pokémon becomes incapable of hearing anything for a while. This is considered to be a weak point."
  - "**Exploud**, the Loud Noise Pokémon\nExploud communicates its feelings to the others by emitting whistle-like sounds from the tubes on its body. This Pokémon only raises its voice when it is in battle."
  - "**Makuhita**, the Guts Pokémon\nThere’s a rumor of a traditional recipe for stew that Trainers can use to raise strong Makuhita."
  - "**Hariyama**, the Arm Thrust Pokémon\nHariyama that are big and fat aren’t necessarily strong. There are some small ones that move nimbly and use moves skillfully."
  - "**Azurill**, the Polka Dot Pokémon\nAzurill’s tail is large and bouncy. It is packed full of the nutrients this Pokémon needs to grow. Azurill can be seen bouncing and playing on its big, rubbery tail."
  - "**Nosepass**, the Compass Pokémon\nIt hunts without twitching a muscle by pulling in its prey with powerful magnetism. But sometimes it pulls natural enemies in close."
  - "**Skitty**, the Kitten Pokémon\nSkitty is known to chase around playfully after its own tail. In the wild, this Pokémon lives in holes in the trees of forests. It is very popular as a pet because of its adorable looks."
  - "**Delcatty**, the Prim Pokémon\nDelcatty sleeps anywhere it wants without keeping a permanent nest. If other Pokémon approach it as it sleeps, this Pokémon will never fight—it will just move away somewhere else."
  - "**Sableye**, the Darkness Pokémon\nMaterials from gems it has eaten float to the surface of its body and can form an infinite number of patterns among individuals."
  - "**Mawile**, the Deceiver Pokémon\nIt has two mouths. The big jaws on the back of its head can’t taste anything, so that’s the mouth it uses to eat foods it doesn’t like."
  - "**Aron**, the Iron Armor Pokémon\nAron has a body of steel. With one all-out charge, this Pokémon can demolish even a heavy dump truck. The destroyed dump truck then becomes a handy meal for the Pokémon."
  - "**Lairon**, the Iron Armor Pokémon\nLairon feeds on iron contained in rocks and water. It makes its nest on mountains where iron ore is buried. As a result, the Pokémon often clashes with humans mining the iron ore."
  - "**Aggron**, the Iron Armor Pokémon\nAggron is protective of its environment. If its mountain is ravaged by a landslide or a fire, this Pokémon will haul topsoil to the area, plant trees, and beautifully restore its own territory."
  - "**Meditite**, the Meditate Pokémon\nMeditite heightens its inner energy through meditation. It survives on just one berry a day. Minimal eating is another aspect of this Pokémon’s training."
  - "**Medicham**, the Meditate Pokémon\nThrough the power of meditation, Medicham developed its sixth sense. It gained the ability to use psychokinetic powers. This Pokémon is known to meditate for a whole month without eating."
  - "**Electrike**, the Lightning Pokémon\nStatic electricity builds up all over its body as strands of its long fur rub together. This Pokémon boasts incredible speed."
  - "**Manectric**, the Discharge Pokémon\nIt stimulates its own muscles with electricity, so it can move quickly. It eases its soreness with electricity, too, so it can recover quickly as well."
  - "**Plusle**, the Cheering Pokémon\nWhen Plusle is cheering on its partner, it flashes with electric sparks from all over its body. If its partner loses, this Pokémon cries loudly."
  - "**Minun**, the Cheering Pokémon\nMinun loves to cheer on its partner in battle. It gives off sparks from its body while it is doing so. If its partner is in trouble, this Pokémon gives off increasing amounts of sparks."
  - "**Volbeat**, the Firefly Pokémon\nVolbeat’s tail glows like a lightbulb. With other Volbeat, it uses its tail to draw geometric shapes in the night sky. This Pokémon loves the sweet aroma given off by Illumise."
  - "**Illumise**, the Firefly Pokémon\nIllumise leads a flight of illuminated Volbeat to draw signs in the night sky. This Pokémon is said to earn greater respect from its peers by composing more complex designs in the sky."
  - "**Roselia**, the Thorn Pokémon\nOn extremely rare occasions, a Roselia is said to appear with its flowers in unusual colors. The thorns on this Pokémon’s head contain a vicious poison."
  - "**Gulpin**, the Stomach Pokémon\nMost of Gulpin’s body is made up of its stomach—its heart and brain are very small in comparison. This Pokémon’s stomach contains special enzymes that dissolve anything."
  - "**Swalot**, the Poison Bag Pokémon\nSwalot has no teeth, so what it eats, it swallows whole, no matter what. Its cavernous mouth yawns widely. An automobile tire could easily fit inside this Pokémon’s mouth."
  - "**Carvanha**, the Savage Pokémon\nWith its sturdy jaws and fangs, it can easily chomp wooden boats to splinters. It fights with Basculin over food."
  - "**Sharpedo**, the Brutal Pokémon\nIt drinks in seawater and jets it from its rear to propel itself. It’s very sensitive to the scent of blood."
  - "**Wailmer**, the Ball Whale Pokémon\nDue to their memories of when they once lived on land, pods of them will, very rarely, wash up on shore."
  - "**Wailord**, the Float Whale Pokémon\nWhen a small Wailmer is attacked by Sharpedo or Dhelmise, its whole pod works together to protect it."
  - "**Numel**, the Numb Pokémon\nNumel stores magma of almost 2,200 degrees Fahrenheit within its body. If it gets wet, the magma cools and hardens. In that event, the Pokémon’s body grows heavy and its movements become sluggish."
  - "**Camerupt**, the Eruption Pokémon\nThe humps on Camerupt’s back are formed by a transformation of its bones. They sometimes blast out molten magma. This Pokémon apparently erupts often when it is enraged."
  - "**Torkoal**, the Coal Pokémon\nIt burns coal to produce energy. When it has burned through all of its coal, it becomes unable to move."
  - "**Spoink**, the Bounce Pokémon\nSpoink keeps a pearl on top of its head. The pearl functions to amplify this Pokémon’s psychokinetic powers. It is therefore on a constant search for a bigger pearl."
  - "**Grumpig**, the Manipulate Pokémon\nGrumpig uses the black pearls on its body to wield its fantastic powers. When it is doing so, it dances bizarrely. This Pokémon’s black pearls are valuable as works of art."
  - "**Spinda**, the Spot Panda Pokémon\nEach Spinda’s spot pattern is different. With its stumbling movements, it evades opponents’ attacks brilliantly!"
  - "**Trapinch**, the Ant Pit Pokémon\nIt builds nests that double as traps, lying in wait for its prey to get caught. When night falls, it digs itself a spot beneath the sand to sleep."
  - "**Vibrava**, the Vibration Pokémon\nIt vibrates its wings to send out odd sound waves. Trainers who are with it need earplugs."
  - "**Flygon**, the Mystic Pokémon\nPeople continue to have their hearts stolen by its enchanting songs and find themselves stranded in the desert."
  - "**Cacnea**, the Cactus Pokémon\nThe more arid and harsh the environment, the more pretty and fragrant a flower Cacnea grows. This Pokémon battles by wildly swinging its thorny arms."
  - "**Cacturne**, the Scarecrow Pokémon\nIf a traveler is going through a desert in the thick of night, Cacturne will follow in a ragtag group. The Pokémon are biding their time, waiting for the traveler to tire and become incapable of moving."
  - "**Swablu**, the Cotton Bird Pokémon\nSwablu loves to make things clean. If it spots something dirty, it will wipe and polish it with its cottony wings. If its wings become dirty, this Pokémon finds a stream and showers itself."
  - "**Altaria**, the Humming Pokémon\nAltaria sings in a gorgeous soprano. Its wings are like cotton clouds. This Pokémon catches updrafts with its buoyant wings and soars way up into the wild blue yonder."
  - "**Zangoose**, the Cat Ferret Pokémon\nZangoose usually stays on all fours, but when angered, it gets up on its hind legs and extends its claws. This Pokémon shares a bitter rivalry with Seviper that dates back over generations."
  - "**Seviper**, the Fang Snake Pokémon\nSeviper’s swordlike tail serves two purposes—it slashes foes and douses them with secreted poison. This Pokémon will not give up its long-running blood feud with Zangoose."
  - "**Lunatone**, the Meteorite Pokémon\nLunatone becomes active around the time of the full moon. Instead of walking, it moves by floating in midair. The Pokémon’s intimidating red eyes cause all those who see it to become transfixed with fear."
  - "**Solrock**, the Meteorite Pokémon\nSunlight is the source of Solrock’s power. It is said to possess the ability to read the emotions of others. This Pokémon gives off intense heat while rotating its body."
  - "**Barboach**, the Whiskers Pokémon\nIts whiskers are filled with nerves. They can sense smells and flavors just as a person’s nose or tongue would."
  - "**Whiscash**, the Whiskers Pokémon\nIts vision is not that good. It senses vibrations in the water with its whiskers to determine the location of its prey."
  - "**Corphish**, the Ruffian Pokémon\nIt can adapt very well to its environment. Feebas and Corphish are about the only Pokémon to live in stagnant ditches."
  - "**Crawdaunt**, the Rogue Pokémon\nIts pincers often fall off. Unlike with Crabrawler or Clauncher, the meat in its claws is utterly nasty and stinking."
  - "**Baltoy**, the Clay Doll Pokémon\nWhen they find others of their kind, they cry out loudly and gather together. Large numbers of them can be found in old graveyards."
  - "**Claydol**, the Clay Doll Pokémon\nThe ancient people who made it apparently modeled it after something that descended from the sky. It fires beams from both arms."
  - "**Lileep**, the Sea Lily Pokémon\nIt sticks to rocks with its powerful suckers and can’t be washed away no matter how rough the surf gets."
  - "**Cradily**, the Barnacle Pokémon\nThis carnivorous Pokémon lived in primordial seas. It catches prey in its eight tentacles and dissolves them with digestive fluid as it eats."
  - "**Anorith**, the Old Shrimp Pokémon\nThis is one kind of primeval bug Pokémon. With eight wings, it could apparently swim a lot faster than you’d expect."
  - "**Armaldo**, the Plate Pokémon\nArmaldo adapted from living in water to living on land. It has been determined that it is the ancestor of some bug Pokémon."
  - "**Feebas**, the Fish Pokémon\nBecause of its wretched appearance, most people pay it no attention, but there are some who collect Feebas—and Feebas alone!"
  - "**Milotic**, the Tender Pokémon\nIts dwelling place is the bottom of big lakes. Those who behold its loveliness are said to have their hearts purified."
  - "**Castform**, the Weather Pokémon\nIts form changes depending on the weather. The rougher conditions get, the rougher Castform’s disposition!"
  - "**Kecleon**, the Color Swap Pokémon\nIts color changes for concealment and also when its mood or health changes. The darker the color, the healthier it is."
  - "**Shuppet**, the Puppet Pokémon\nThere’s a proverb that says, “Shun the house where Shuppet gather in the growing dusk.”"
  - "**Banette**, the Marionette Pokémon\nResentment at being cast off made it spring into being. Some say that treating it well will satisfy it, and it will once more become a stuffed toy."
  - "**Duskull**, the Requiem Pokémon\nDuskull wanders lost among the deep darkness of midnight. There is an oft-told admonishment given to misbehaving children that this Pokémon will spirit away bad children who earn scoldings from their mothers."
  - "**Dusclops**, the Beckon Pokémon\nDusclops absorbs anything, however large the object may be. This Pokémon hypnotizes its foe by waving its hands in a macabre manner and by bringing its single eye to bear. The hypnotized foe is made to do Dusclops’s bidding."
  - "**Tropius**, the Fruit Pokémon\nBunches of delicious fruit grow around its neck. In warm areas, many ranches raise Tropius."
  - "**Chimecho**, the Wind Chime Pokémon\nIn high winds, Chimecho cries as it hangs from a tree branch or the eaves of a building using a suction cup on its head. This Pokémon plucks berries with its long tail and eats them."
  - "**Absol**, the Disaster Pokémon\nThe elderly call it the disaster Pokémon and detest it, but interest in its power to predict disasters is on the rise."
  - "**Wynaut**, the Bright Pokémon\nWynaut gather on moonlit nights to play by squeezing up against each other. By being squeezed, this Pokémon gains endurance and is trained to dole out powerful counterattacks."
  - "**Snorunt**, the Snow Hat Pokémon\nRich people from cold areas all share childhood memories of playing with Snorunt."
  - "**Glalie**, the Face Pokémon\nIts actual body is a rock that isn’t particularly hard. Glalie absorbs moisture from the air and drapes itself in an armor of ice."
  - "**Spheal**, the Clap Pokémon\nSpheal always travels by rolling around on its ball-like body. When the season for ice floes arrives, this Pokémon can be seen rolling about on ice and crossing the sea."
  - "**Sealeo**, the Ball Roll Pokémon\nSealeo often balances and rolls things on the tip of its nose. While the Pokémon is rolling something, it checks the object’s aroma and texture to determine whether it likes the object or not."
  - "**Walrein**, the Ice Break Pokémon\nWalrein swims all over in frigid seawater while crushing icebergs with its grand, imposing tusks. Its thick layer of blubber makes enemy attacks bounce off harmlessly."
  - "**Clamperl**, the Bivalve Pokémon\nClamperl’s pearls are exceedingly precious. They can be more than 10 times as costly as Shellder’s pearls."
  - "**Huntail**, the Deep Sea Pokémon\nDeep seas are their habitat. According to tradition, when Huntail wash up onshore, something unfortunate will happen."
  - "**Gorebyss**, the South Sea Pokémon\nIt sucks bodily fluids out of its prey. The leftover meat sinks to the seafloor, where it becomes food for other Pokémon."
  - "**Relicanth**, the Longevity Pokémon\nThe reason it hasn’t changed at all in a hundred million years is that it’s apparently already a perfect life-form."
  - "**Luvdisc**, the Rendezvous Pokémon\nLuvdisc makes its home in coral reefs in warm seas. It especially likes sleeping in the space between Corsola’s branches."
  - "**Bagon**, the Rock Head Pokémon\nSome theories suggest that its behavior of forcefully bashing its head into things stimulates cells that affect its evolution."
  - "**Shelgon**, the Endurance Pokémon\nShelgon lives deep within caves. It stays shut up in its hard shell, dreaming of the day it will be able to fly."
  - "**Salamence**, the Dragon Pokémon\nThanks to its fervent wishes, the cells in its body finally mutated, and at last it has its heart’s desire—wings."
  - "**Beldum**, the Iron Ball Pokémon\nIf you anger it, it will do more than rampage. It will also burst out strong magnetism, causing nearby machines to break."
  - "**Metang**, the Iron Claw Pokémon\nIt flies at high speeds around the skies. When it finds its prey, Metang takes a firm grip with its sharp claws and never lets go."
  - "**Metagross**, the Iron Leg Pokémon\nIt analyzes its opponents with more accuracy than a supercomputer, which enables it to calmly back them into a corner."
  - "**Regirock**, the Rock Peak Pokémon\nRegirock’s body is composed entirely of rocks. Recently, a study made the startling discovery that the rocks were all unearthed from different locations."
  - "**Regice**, the Iceberg Pokémon\nRegice cloaks itself with frigid air of -328 degrees Fahrenheit. Things will freeze solid just by going near this Pokémon. Its icy body is so cold, it will not melt even if it is immersed in magma."
  - "**Registeel**, the Iron Pokémon\nRegisteel was imprisoned by people in ancient times. The metal composing its body is thought to be a curious substance that is not of this earth."
  - "**Latias**, the Eon Pokémon\nLatias is highly intelligent and capable of understanding human speech. It is covered with a glass-like down. The Pokémon enfolds its body with its down and refracts light to alter its appearance."
  - "**Latios**, the Eon Pokémon\nLatios will only open its heart to a Trainer with a compassionate spirit. This Pokémon can fly faster than a jet plane by folding its forelegs to minimize air resistance."
  - "**Kyogre**, the Sea Basin Pokémon\nKyogre is said to be the personification of the sea itself. Legends tell of its many clashes against Groudon, as each sought to gain the power of nature."
  - "**Groudon**, the Continent Pokémon\nThrough Primal Reversion and with nature’s full power, it will take back its true form. It can cause magma to erupt and expand the landmass of the world."
  - "**Rayquaza**, the Sky High Pokémon\nIt flies forever through the ozone layer, consuming meteoroids for sustenance. The many meteoroids in its body provide the energy it needs to Mega Evolve."
  - "**Jirachi**, the Wish Pokémon\nJirachi will awaken from its sleep of a thousand years if you sing to it in a voice of purity. It is said to make true any wish that people desire."
  - "**Deoxys**, the DNA Pokémon\nDeoxys emerged from a virus that came from space. It is highly intelligent and wields psychokinetic powers. This Pokémon shoots lasers from the crystalline organ on its chest."
  - "**Turtwig**, the Tiny Leaf Pokémon\nIt undertakes photosynthesis with its body, making oxygen. The leaf on its head wilts if it is thirsty."
  - "**Grotle**, the Grove Pokémon\nIt knows where pure water wells up. It carries fellow Pokémon there on its back."
  - "**Torterra**, the Continent Pokémon\nSmall Pokémon occasionally gather on its unmoving back to begin building their nests."
  - "**Chimchar**, the Chimp Pokémon\nThe gas made in its belly burns from its rear end. The fire burns weakly when it feels sick."
  - "**Monferno**, the Playful Pokémon\nIt uses ceilings and walls to launch aerial attacks. Its fiery tail is but one weapon."
  - "**Infernape**, the Flame Pokémon\nIt tosses its enemies around with agility. It uses all its limbs to fight in its own unique style."
  - "**Piplup**, the Penguin Pokémon\nBecause it is very proud, it hates accepting food from people. Its thick down guards it from cold."
  - "**Prinplup**, the Penguin Pokémon\nIt lives a solitary life. Its wings deliver wicked blows that can snap even the thickest of trees."
  - "**Empoleon**, the Emperor Pokémon\nThe three horns that extend from its beak attest to its power. The leader has the biggest horns."
  - "**Starly**, the Starling Pokémon\nThey flock around mountains and fields, chasing after bug Pokémon. Their singing is noisy and annoying."
  - "**Staravia**, the Starling Pokémon\nIt lives in forests and fields. Squabbles over territory occur when flocks collide."
  - "**Staraptor**, the Predator Pokémon\nWhen Staravia evolve into Staraptor, they leave the flock to live alone. They have sturdy wings."
  - "**Bidoof**, the Plump Mouse Pokémon\nIt constantly gnaws on logs and rocks to whittle down its front teeth. It nests alongside water."
  - "**Bibarel**, the Beaver Pokémon\nIt makes its nest by damming streams with bark and mud. It is known as an industrious worker."
  - "**Kricketot**, the Cricket Pokémon\nWhen its antennae hit each other, it sounds like the music of a xylophone."
  - "**Kricketune**, the Cricket Pokémon\nIt signals its emotions with its melodies. Scientists are studying these melodic patterns."
  - "**Shinx**, the Flash Pokémon\nAll of its fur dazzles if danger is sensed. It flees while the foe is momentarily blinded."
  - "**Luxio**, the Spark Pokémon\nStrong electricity courses through the tips of its sharp claws. A light scratch causes fainting in foes."
  - "**Luxray**, the Gleam Eyes Pokémon\nLuxray’s ability to see through objects comes in handy when it’s scouting for danger."
  - "**Budew**, the Bud Pokémon\nOver the winter, it closes its bud and endures the cold. In spring, the bud opens and releases pollen."
  - "**Roserade**, the Bouquet Pokémon\nWith the movements of a dancer, it strikes with whips that are densely lined with poison thorns."
  - "**Cranidos**, the Head Butt Pokémon\nIts hard skull is its distinguishing feature. It snapped trees by headbutting them, and then it fed on their ripe berries."
  - "**Rampardos**, the Head Butt Pokémon\nThis ancient Pokémon used headbutts skillfully. Its brain was really small, so some theories suggest that its stupidity led to its extinction."
  - "**Shieldon**, the Shield Pokémon\nAlthough its fossils can be found in layers of primeval rock, nothing but its face has ever been discovered."
  - "**Bastiodon**, the Shield Pokémon\nThis Pokémon is from roughly 100 million years ago. Its terrifyingly tough face is harder than steel."
  - "**Burmy**, the Bagworm Pokémon\nIf its cloak is broken in battle, it quickly remakes the cloak with materials nearby."
  - "**Wormadam**, the Bagworm Pokémon\nWhen Burmy evolved, its cloak became a part of this Pokémon’s body. The cloak is never shed."
  - "**Mothim**, the Moth Pokémon\nIt flutters around at night and steals honey from the Combee hive."
  - "**Combee**, the Tiny Bee Pokémon\nIt collects and delivers honey to its colony. At night, they cluster to form a beehive and sleep."
  - "**Vespiquen**, the Beehive Pokémon\nIts abdomen is a honeycomb for grubs. It raises its grubs on honey collected by Combee."
  - "**Pachirisu**, the EleSquirrel Pokémon\nA pair may be seen rubbing their cheek pouches together in an effort to share stored electricity."
  - "**Buizel**, the Sea Weasel Pokémon\nIt inflates the flotation sac around its neck and pokes its head out of the water to see what is going on."
  - "**Floatzel**, the Sea Weasel Pokémon\nIts flotation sac developed as a result of pursuing aquatic prey. It can double as a rubber raft."
  - "**Cherubi**, the Cherry Pokémon\nIt evolves by sucking the energy out of the small ball where it had been storing nutrients."
  - "**Cherrim**, the Blossom Pokémon\nIf it senses strong sunlight, it opens its folded petals to absorb the sun’s rays with its whole body."
  - "**Shellos**, the Sea Slug Pokémon\nWhen it senses danger, a purple liquid oozes out of it. The liquid is thought to be something like greasy sweat."
  - "**Gastrodon**, the Sea Slug Pokémon\nTheir shape and color change, depending on their environment and diet. There are many of them at beaches where the waves are calm."
  - "**Ambipom**, the Long Tail Pokémon\nIt uses its tails for everything. If it wraps both of its tails around you and gives you a squeeze, that’s proof it really likes you."
  - "**Drifloon**, the Balloon Pokémon\nWandering souls gathered together to form this Pokémon. When trying to make friends with children, Drifloon grabs them by the hand."
  - "**Drifblim**, the Blimp Pokémon\nThe raw material for the gas inside its body is souls. When its body starts to deflate, it’s thought to carry away people and Pokémon."
  - "**Buneary**, the Rabbit Pokémon\nThe reason it keeps one ear rolled up is so it can launch a swift counterattack if it’s attacked by an enemy."
  - "**Lopunny**, the Rabbit Pokémon\nIt’s notably wary and has a dislike of fighting, but at the same time, it can deliver powerful kicks with its lithe legs."
  - "**Mismagius**, the Magical Pokémon\nIts muttered curses can cause awful headaches or terrifying visions that torment others."
  - "**Honchkrow**, the Big Boss Pokémon\nIts goons take care of most of the fighting for it. The only time it dirties its own hands is in delivering a final blow to finish off an opponent."
  - "**Glameow**, the Catty Pokémon\nWhen it’s happy, Glameow demonstrates beautiful movements of its tail, like a dancing ribbon."
  - "**Purugly**, the Tiger Cat Pokémon\nTo make itself appear intimidatingly beefy, it tightly cinches its waist with its twin tails."
  - "**Chingling**, the Bell Pokémon\nThere is an orb inside its mouth. When it hops, the orb bounces all over and makes a ringing sound."
  - "**Stunky**, the Skunk Pokémon\nIt protects itself by spraying a noxious fluid from its rear. The stench lingers for 24 hours."
  - "**Skuntank**, the Skunk Pokémon\nIt sprays a stinky fluid from its tail. The fluid smells worse the longer it is allowed to fester."
  - "**Bronzor**, the Bronze Pokémon\nImplements shaped like it were discovered in ancient tombs. It is unknown if they are related."
  - "**Bronzong**, the Bronze Bell Pokémon\nAncient people believed that petitioning Bronzong for rain was the way to make crops grow."
  - "**Bonsly**, the Bonsai Pokémon\nIf its body gets too damp, it will die. So, in a process reminiscent of sweating, its eyes expel moisture."
  - "**Mime Jr.**, the Mime Pokémon\nWhen this gifted mimic surprises an opponent, Mime Jr. feels so happy that it ends up forgetting it was imitating something."
  - "**Happiny**, the Playhouse Pokémon\nWhen it sees something round and white, Happiny puts it into the pouch on its stomach. It sometimes becomes overloaded and can’t move."
  - "**Chatot**, the Music Note Pokémon\nIt can learn and speak human words. If they gather, they all learn the same saying."
  - "**Spiritomb**, the Forbidden Pokémon\nIt was bound to a fissure in an odd keystone as punishment for misdeeds 500 years ago."
  - "**Gible**, the Land Shark Pokémon\nIts original home is an area much hotter than Alola. If you’re planning to live with one, your heating bill will soar."
  - "**Gabite**, the Cave Pokémon\nIt sheds its skin and gradually grows larger. Its scales can be ground into a powder and used as raw materials for traditional medicine."
  - "**Garchomp**, the Mach Pokémon\nIts fine scales don’t just reduce wind resistance—their sharp edges also cause injury to any opponent who attacks it."
  - "**Munchlax**, the Big Eater Pokémon\nAnything that looks edible, Munchlax will go on and swallow whole. Its stomach is tough enough to handle it even if the food has gone rotten."
  - "**Riolu**, the Emanation Pokémon\nIt uses waves called auras to communicate with others of its kind. It doesn’t make any noise during this time, so its enemies can’t detect it."
  - "**Lucario**, the Aura Pokémon\nLucario reads its opponent’s feelings with its aura waves. It finds out things it would rather not know, so it gets stressed out easily."
  - "**Hippopotas**, the Hippo Pokémon\nIt enshrouds itself with sand to protect itself from germs. It does not enjoy getting wet."
  - "**Hippowdon**, the Heavyweight Pokémon\nIt blasts internally stored sand from ports on its body to create a towering twister for attack."
  - "**Skorupi**, the Scorpion Pokémon\nIt burrows under the sand to lie in wait for prey. Its tail claws can inject its prey with a savage poison."
  - "**Drapion**, the Ogre Scorpion Pokémon\nIt has the power in its clawed arms to make scrap of a car. The tips of its claws release poison."
  - "**Croagunk**, the Toxic Mouth Pokémon\nInflating its poison sacs, it fills the area with an odd sound and hits flinching opponents with a poison jab."
  - "**Toxicroak**, the Toxic Mouth Pokémon\nIts knuckle claws secrete a toxin so vile that even a scratch could prove fatal."
  - "**Carnivine**, the Bug Catcher Pokémon\nIt binds itself to trees in marshes. It attracts prey with its sweet-smelling drool and gulps them down."
  - "**Finneon**, the Wing Fish Pokémon\nIt lures in prey with its shining tail fins. It stays near the surface during the day and moves to the depths when night falls."
  - "**Lumineon**, the Neon Pokémon\nThey traverse the deep waters as if crawling over the seafloor. The fantastic lights of its fins shine like stars in the night sky."
  - "**Mantyke**, the Kite Pokémon\nMantyke are friendly toward people and will approach boats closely. The patterns on their backs differ depending on their habitat."
  - "**Snover**, the Frost Tree Pokémon\nIn the spring, it grows berries with the texture of frozen treats around its belly."
  - "**Abomasnow**, the Frost Tree Pokémon\nIt lives a quiet life on mountains that are perpetually covered in snow. It hides itself by whipping up blizzards."
  - "**Weavile**, the Sharp Claw Pokémon\nThanks to its increased intelligence, scrapping over food is a thing of the past. A scratch from its claws will give you a case of frostbite!"
  - "**Magnezone**, the Magnet Area Pokémon\nThere are still people who believe that this Pokémon came from outer space. It emanates a powerful magnetic field."
  - "**Lickilicky**, the Licking Pokémon\nIt uses its tongue much more skillfully than its hands or its feet. It can deftly pick up a single small bean with its tongue."
  - "**Rhyperior**, the Drill Pokémon\nIt puts rocks in holes in its palms and uses its muscles to shoot them. Geodude are shot at rare times."
  - "**Tangrowth**, the Vine Pokémon\nIts vines grow so profusely that, in the warm season, you can’t even see its eyes."
  - "**Electivire**, the Thunderbolt Pokémon\nA single Electivire can provide enough electricity for all the buildings in a big city for a year."
  - "**Magmortar**, the Blast Pokémon\nMagmortar takes down its enemies by shooting fireballs, which burn them to a blackened crisp. It avoids this method when hunting prey."
  - "**Togekiss**, the Jubilee Pokémon\nIt shares many blessings with people who respect one another’s rights and avoid needless strife."
  - "**Yanmega**, the Ogre Darner Pokémon\nThis six-legged Pokémon is easily capable of transporting an adult in flight. The wings on its tail help it stay balanced."
  - "**Leafeon**, the Verdant Pokémon\nIt gets its nutrition from photosynthesis. It lives a quiet life deep in forests where clean rivers flow."
  - "**Glaceon**, the Fresh Snow Pokémon\nIt can instantaneously freeze any moisture that’s around it, creating ice pellets to shoot at its prey."
  - "**Gliscor**, the Fang Scorpion Pokémon\nIts flight is soundless. It uses its lengthy tail to carry off its prey... Then its elongated fangs do the rest."
  - "**Mamoswine**, the Twin Tusk Pokémon\nIts impressive tusks are made of ice. The population thinned when it turned warm after the ice age."
  - "**Porygon-Z**, the Virtual Pokémon\nA faulty update was added to its programming. Its behavior is noticeably strange, so the experiment may have been a failure."
  - "**Gallade**, the Blade Pokémon\nA master of courtesy and swordsmanship, it fights using extending swords on its elbows."
  - "**Probopass**, the Compass Pokémon\nIt uses three small units to catch prey and battle enemies. The main body mostly just gives orders."
  - "**Dusknoir**, the Gripper Pokémon\nThe antenna on its head captures radio waves from the world of spirits that command it to take people there."
  - "**Froslass**, the Snow Land Pokémon\nIt’s said that on nights of terrible blizzards, it comes down to human settlements. If you hear it knocking at your door, do not open it!"
  - "**Rotom**, the Plasma Pokémon\nIts body is composed of plasma. It is known to infiltrate electronic devices and wreak havoc."
  - "**Uxie**, the Knowledge Pokémon\nIt is said that its emergence gave humans the intelligence to improve their quality of life."
  - "**Mesprit**, the Emotion Pokémon\nIt sleeps at the bottom of a lake. Its spirit is said to leave its body to fly on the lake’s surface."
  - "**Azelf**, the Willpower Pokémon\nIt is thought that Uxie, Mesprit, and Azelf all came from the same egg."
  - "**Dialga**, the Temporal Pokémon\nIt has the power to control time. It appears in Sinnoh-region myths as an ancient deity."
  - "**Palkia**, the Spatial Pokémon\nIt has the ability to distort space. It is described as a deity in Sinnoh-region mythology."
  - "**Heatran**, the Lava Dome Pokémon\nBoiling blood, like magma, circulates through its body. It makes its dwelling place in volcanic caves."
  - "**Regigigas**, the Colossal Pokémon\nThere is an enduring legend that states this Pokémon towed continents with ropes."
  - "**Giratina**, the Renegade Pokémon\nIt was banished for its violence. It silently gazed upon the old world from the Distortion World."
  - "**Cresselia**, the Lunar Pokémon\nThose who sleep holding Cresselia’s feather are assured of joyful dreams. It is said to represent the crescent moon."
  - "**Phione**, the Sea Drifter Pokémon\nIt drifts in warm seas. It always returns to where it was born, no matter how far it may have drifted."
  - "**Manaphy**, the Seafaring Pokémon\nIt starts its life with a wondrous power that permits it to bond with any kind of Pokémon."
  - "**Darkrai**, the Pitch-Black Pokémon\nIt can lull people to sleep and make them dream. It is active during nights of the new moon."
  - "**Shaymin**, the Gratitude Pokémon\nThe blooming of Gracidea flowers confers the power of flight upon it. Feelings of gratitude are the message it delivers."
  - "**Arceus**, the Alpha Pokémon\nIt is told in mythology that this Pokémon was born before the universe even existed."
  - "**Victini**, the Victory Pokémon\nWhen it shares the infinite energy it creates, that being’s entire body will be overflowing with power."
  - "**Snivy**, the Grass Snake Pokémon\nThey photosynthesize by bathing their tails in sunlight. When they are not feeling well, their tails droop."
  - "**Servine**, the Grass Snake Pokémon\nWhen it gets dirty, its leaves can’t be used in photosynthesis, so it always keeps itself clean."
  - "**Serperior**, the Regal Pokémon\nIt can stop its opponents’ movements with just a glare. It takes in solar energy and boosts it internally."
  - "**Tepig**, the Fire Pig Pokémon\nIt loves to eat roasted berries, but sometimes it gets too excited and burns them to a crisp."
  - "**Pignite**, the Fire Pig Pokémon\nWhen its internal fire flares up, its movements grow sharper and faster. When in trouble, it emits smoke."
  - "**Emboar**, the Mega Fire Pig Pokémon\nIt has mastered fast and powerful fighting moves. It grows a beard of fire."
  - "**Oshawott**, the Sea Otter Pokémon\nIt fights using the scalchop on its stomach. In response to an attack, it retaliates immediately by slashing."
  - "**Dewott**, the Discipline Pokémon\nAs a result of strict training, each Dewott learns different forms for using the scalchops."
  - "**Samurott**, the Formidable Pokémon\nOne swing of the sword incorporated in its armor can fell an opponent. A simple glare from one of them quiets everybody."
  - "**Patrat**, the Scout Pokémon\nExtremely cautious, one of them will always be on the lookout, but it won’t notice a foe coming from behind."
  - "**Watchog**, the Lookout Pokémon\nWhen they see an enemy, their tails stand high, and they spit the seeds of berries stored in their cheek pouches."
  - "**Lillipup**, the Puppy Pokémon\nThis Pokémon is popular with beginners because it’s intelligent, obedient to its Trainer’s commands, and easy to raise."
  - "**Herdier**, the Loyal Dog Pokémon\nIt has been living with people for so long that portrayals of it can be found on the walls of caves from long, long ago."
  - "**Stoutland**, the Big-Hearted Pokémon\nIts fur is long and thick. A long time ago in cold regions, every household kept a Stoutland."
  - "**Purrloin**, the Devious Pokémon\nThey steal from people for fun, but their victims can’t help but forgive them. Their deceptively cute act is perfect."
  - "**Liepard**, the Cruel Pokémon\nStealthily, it sneaks up on its target, striking from behind before its victim has a chance to react."
  - "**Pansage**, the Grass Monkey Pokémon\nIt’s good at finding berries and gathers them from all over. It’s kind enough to share them with friends."
  - "**Simisage**, the Thorn Monkey Pokémon\nIll tempered, it fights by swinging its barbed tail around wildly. The leaf growing on its head is very bitter."
  - "**Pansear**, the High Temp Pokémon\nThis Pokémon lives in caves in volcanoes. The fire within the tuft on its head can reach 600 degrees Fahrenheit."
  - "**Simisear**, the Ember Pokémon\nWhen it gets excited, embers rise from its head and tail and it gets hot. For some reason, it loves sweets."
  - "**Panpour**, the Spray Pokémon\nThe water stored inside the tuft on its head is full of nutrients. Plants that receive its water grow large."
  - "**Simipour**, the Geyser Pokémon\nIt prefers places with clean water. When its tuft runs low, it replenishes it by siphoning up water with its tail."
  - "**Munna**, the Dream Eater Pokémon\nIt eats the dreams of people and Pokémon. When it eats a pleasant dream, it expels pink-colored mist."
  - "**Musharna**, the Drowsing Pokémon\nThe dream mist coming from its forehead changes into many different colors depending on the dream that was eaten."
  - "**Pidove**, the Tiny Pigeon Pokémon\nThese Pokémon live in cities. They are accustomed to people. Flocks often gather in parks and plazas."
  - "**Tranquill**, the Wild Pigeon Pokémon\nNo matter where in the world it goes, it knows where its nest is, so it never gets separated from its Trainer."
  - "**Unfezant**, the Proud Pokémon\nMales have plumage on their heads. They will never let themselves feel close to anyone other than their Trainers."
  - "**Blitzle**, the Electrified Pokémon\nIts mane shines when it discharges electricity. They use the frequency and rhythm of these flashes to communicate."
  - "**Zebstrika**, the Thunderbolt Pokémon\nThey have lightning-like movements. When Zebstrika run at full speed, the sound of thunder reverberates."
  - "**Roggenrola**, the Mantle Pokémon\nIt was found in a fissure in a layer of exposed rock. The material that makes up its body is dirt from several hundred years ago."
  - "**Boldore**, the Ore Pokémon\nIts orange crystals are lumps of powerful energy. They’re valuable, so Boldore is sometimes targeted for them."
  - "**Gigalith**, the Compressed Pokémon\nIt absorbs rays of sunlight and shoots out energy. It’s usually lurking deep beneath the surface."
  - "**Woobat**, the Bat Pokémon\nThe heart-shaped mark left on a body after a Woobat has been attached to it is said to bring good fortune."
  - "**Swoobat**, the Courting Pokémon\nAnyone who comes into contact with the ultrasonic waves emitted by a courting male experiences a positive mood shift."
  - "**Drilbur**, the Mole Pokémon\nBy spinning its body, it can dig straight through the ground at a speed of 30 mph."
  - "**Excadrill**, the Subterrene Pokémon\nMore than 300 feet below the surface, they build mazelike nests. Their activity can be destructive to subway tunnels."
  - "**Audino**, the Hearing Pokémon\nIt touches others with the feelers on its ears, using the sound of their heartbeats to tell how they are feeling."
  - "**Timburr**, the Muscular Pokémon\nAlways carrying squared logs, they help out with construction. As they grow, they carry bigger logs."
  - "**Gurdurr**, the Muscular Pokémon\nThis Pokémon is so muscular and strongly built that even a group of wrestlers could not make it budge an inch."
  - "**Conkeldurr**, the Muscular Pokémon\nRather than rely on force, they master moves that utilize the centrifugal force of spinning concrete."
  - "**Tympole**, the Tadpole Pokémon\nBy vibrating its cheeks, it emits sound waves imperceptible to humans. It uses the rhythm of these sounds to talk."
  - "**Palpitoad**, the Vibration Pokémon\nIt lives in the water and on land. It uses its long, sticky tongue to immobilize its opponents."
  - "**Seismitoad**, the Vibration Pokémon\nThey shoot paralyzing liquid from their head bumps. They use vibration to hurt their opponents."
  - "**Throh**, the Judo Pokémon\nWhen it encounters a foe bigger than itself, it wants to throw it. It changes belts as it gets stronger."
  - "**Sawk**, the Karate Pokémon\nTying their belts gets them pumped and makes their punches more destructive. Disturbing their training angers them."
  - "**Sewaddle**, the Sewing Pokémon\nSince this Pokémon makes its own clothes out of leaves, it is a popular mascot for fashion designers."
  - "**Swadloon**, the Leaf-Wrapped Pokémon\nIt protects itself from the cold by wrapping up in leaves. It stays on the move, eating leaves in forests."
  - "**Leavanny**, the Nurturing Pokémon\nIt keeps its eggs warm with heat from fermenting leaves. It also uses leaves to make warm wrappings for Sewaddle."
  - "**Venipede**, the Centipede Pokémon\nIts bite injects a potent poison, enough to paralyze large bird Pokémon that try to prey on it."
  - "**Whirlipede**, the Curlipede Pokémon\nIt is usually motionless, but when attacked, it rotates at high speed and then crashes into its opponent."
  - "**Scolipede**, the Megapede Pokémon\nWith quick movements, it chases down its foes, attacking relentlessly with its horns until it prevails."
  - "**Cottonee**, the Cotton Puff Pokémon\nWhen attacked, it expels cotton from its body to create a diversion. The cotton it loses grows back in quickly."
  - "**Whimsicott**, the Windveiled Pokémon\nWhimsicott doesn’t live in a fixed location. It floats around on whirling winds, appearing all over the place to perform its mischief."
  - "**Petilil**, the Bulb Pokémon\nThey prefer clean water and soil. When the environment they live in turns bad, the whole bunch will up and move to a new area."
  - "**Lilligant**, the Flowering Pokémon\nIt’s well liked by other Pokémon because of its beauty. The flower on its head needs constant care, or it will soon wither and rot."
  - "**Basculin**, the Hostile Pokémon\nWhen a school of Basculin appears in a lake, everything else disappears, except for Corphish and Crawdaunt. That’s how violent Basculin are."
  - "**Sandile**, the Desert Croc Pokémon\nSandile’s still not good at hunting, so it mostly eats things that have collapsed in the desert. It’s called “the cleaner of the desert.”"
  - "**Krokorok**, the Desert Croc Pokémon\nIt buries some of its prey in the sand to use as emergency meals when its hunts are unsuccessful."
  - "**Krookodile**, the Intimidation Pokémon\nIt conceals itself in sandstorms that Flygon whip up and waits patiently for prey to appear."
  - "**Darumaka**, the Zen Charm Pokémon\nWhen it sleeps, it pulls its limbs into its body and its internal fire goes down to 1,100 degrees Fahrenheit."
  - "**Darmanitan**, the Blazing Pokémon\nIts internal fire burns at 2,500 degrees Fahrenheit, making enough power that it can destroy a dump truck with one punch."
  - "**Maractus**, the Cactus Pokémon\nArid regions are their habitat. They move rhythmically, making a sound similar to maracas."
  - "**Dwebble**, the Rock Inn Pokémon\nWhen it finds a stone of a suitable size, it secretes a liquid from its mouth to open up a hole to crawl into."
  - "**Crustle**, the Stone Home Pokémon\nCompeting for territory, Crustle fight viciously. The one whose boulder is broken is the loser of the battle."
  - "**Scraggy**, the Shedding Pokémon\nIt stretches its saggy skin up to its neck to protect itself. The saggier their skin, the more respect they garner."
  - "**Scrafty**, the Hoodlum Pokémon\nIt taunts its opponents by spitting. It has a certain territory that it never leaves its whole life long."
  - "**Sigilyph**, the Avianoid Pokémon\nThe guardians of an ancient city, they always fly the same route while keeping watch for invaders."
  - "**Yamask**, the Spirit Pokémon\nEach of them carries a mask that used to be its face when it was human. Sometimes they look at it and cry."
  - "**Cofagrigus**, the Coffin Pokémon\nGrave robbers who mistake them for real coffins and get too close end up trapped inside their bodies."
  - "**Tirtouga**, the Prototurtle Pokémon\nIts hunting grounds encompassed a broad area, from the land to more than half a mile deep in the ocean."
  - "**Carracosta**, the Prototurtle Pokémon\nCarracosta eats every last bit of the prey it catches, even the shells and bones, to further strengthen its sturdy shell."
  - "**Archen**, the First Bird Pokémon\nRestored from a fossil, this ancient bird Pokémon has wings but can’t yet fly."
  - "**Archeops**, the First Bird Pokémon\nSaid to be an ancestor of bird Pokémon, the muscles it uses to flap its wings are still weak, so it needs a long runway in order to take off."
  - "**Trubbish**, the Trash Bag Pokémon\nIf a young Pokémon or child breathes in the toxic gas that Trubbish belches out, it could be a life-threatening situation."
  - "**Garbodor**, the Trash Heap Pokémon\nSome say the reason Garbodor in Alola are a little stronger than their counterparts elsewhere is the presence of Muk, their natural enemy."
  - "**Zorua**, the Tricky Fox Pokémon\nIf a normally talkative child suddenly stops talking, it may have been replaced by Zorua."
  - "**Zoroark**, the Illusion Fox Pokémon\nIf it thinks humans are going to discover its den, Zoroark shows them visions that make them wander around in the woods."
  - "**Minccino**, the Chinchilla Pokémon\nWhen its tail has gotten dirty from self-cleaning or from cleaning its nest, Minccino spends a whole day washing its tail in clean spring water."
  - "**Cinccino**, the Scarf Pokémon\nThe oil that seeps from its body is really smooth. For people troubled by bad skin, this oil is an effective treatment."
  - "**Gothita**, the Fixation Pokémon\nThey intently observe both Trainers and Pokémon. Apparently, they are looking at something that only Gothita can see."
  - "**Gothorita**, the Manipulate Pokémon\nAccording to many old tales, it creates friends for itself by controlling sleeping children on starry nights."
  - "**Gothitelle**, the Astral Body Pokémon\nThey can predict the future from the placement and movement of the stars. They can see Trainers’ life spans."
  - "**Solosis**, the Cell Pokémon\nThey drive away attackers by unleashing psychic power. They can use telepathy to talk with others."
  - "**Duosion**, the Mitosis Pokémon\nWhen their two divided brains think the same thoughts, their psychic power is maximized."
  - "**Reuniclus**, the Multiplying Pokémon\nWhen Reuniclus shake hands, a network forms between their brains, increasing their psychic power."
  - "**Ducklett**, the Water Bird Pokémon\nThey are better at swimming than flying, and they happily eat their favorite food, peat moss, as they dive underwater."
  - "**Swanna**, the White Bird Pokémon\nSwanna start to dance at dusk. The one dancing in the middle is the leader of the flock."
  - "**Vanillite**, the Fresh Snow Pokémon\nWhen the morning sun hit an icicle, it wished not to melt, and thus Vanillite was born. At night, it buries itself in snow to sleep."
  - "**Vanillish**, the Icy Snow Pokémon\nThis hearty Pokémon survived the Ice Age. It’s incredibly popular in very hot regions."
  - "**Vanilluxe**, the Snowstorm Pokémon\nVanilluxe is born when two Vanillish, half-melted by the day’s light, stick to each other and freeze together in the cold return of night."
  - "**Deerling**, the Season Pokémon\nThe turning of the seasons changes the color and scent of this Pokémon’s fur. People use it to mark the seasons."
  - "**Sawsbuck**, the Season Pokémon\nThey migrate according to the seasons, so some people call Sawsbuck the harbingers of spring."
  - "**Emolga**, the Sky Squirrel Pokémon\nAs it flies, it scatters electricity around, so bird Pokémon keep their distance. That’s why Emolga can keep all its food to itself."
  - "**Karrablast**, the Clamping Pokémon\nFor some reason they evolve when they receive electrical energy while they are attacking Shelmet."
  - "**Escavalier**, the Cavalry Pokémon\nThese Pokémon evolve by wearing the shell covering of a Shelmet. The steel armor protects their whole body."
  - "**Foongus**, the Mushroom Pokémon\nIt lures Pokémon with its pattern that looks just like a Poké Ball, then releases poison spores."
  - "**Amoonguss**, the Mushroom Pokémon\nIt lures prey close by dancing and waving its arm caps, which resemble Poké Balls, in a swaying motion."
  - "**Frillish**, the Floating Pokémon\nUsing the invisible poison spikes on its veillike arms and legs, it paralyzes its enemies and causes them to drown."
  - "**Jellicent**, the Floating Pokémon\nFishermen are terrified of Jellicent. It’s rumored to drag them into the sea and steal their lives away."
  - "**Alomomola**, the Caring Pokémon\nThe reason it helps Pokémon in a weakened condition is that any Pokémon coming after them may also attack Alomomola."
  - "**Joltik**, the Attaching Pokémon\nThey attach themselves to large-bodied Pokémon and absorb static electricity, which they store in an electric pouch."
  - "**Galvantula**, the EleSpider Pokémon\nWhen attacked, they create an electric barrier by spitting out many electrically charged threads."
  - "**Ferroseed**, the Thorn Seed Pokémon\nIt absorbs the iron it finds in the rock while clinging to the ceiling. It shoots spikes when in danger."
  - "**Ferrothorn**, the Thorn Pod Pokémon\nThey attach themselves to cave ceilings, firing steel spikes at targets passing beneath them."
  - "**Klink**, the Gear Pokémon\nThe two minigears that mesh together are predetermined. Each will rebound from other minigears without meshing."
  - "**Klang**, the Gear Pokémon\nA minigear and big gear comprise its body. If the minigear it launches at a foe doesn’t return, it will die."
  - "**Klinklang**, the Gear Pokémon\nIts red core functions as an energy tank. It fires the charged energy through its spikes into an area."
  - "**Tynamo**, the EleFish Pokémon\nOne alone can emit only a trickle of electricity, so a group of them gathers to unleash a powerful electric shock."
  - "**Eelektrik**, the EleFish Pokémon\nThese Pokémon have a big appetite. When they spot their prey, they attack it and paralyze it with electricity."
  - "**Eelektross**, the EleFish Pokémon\nThey crawl out of the ocean using their arms. They will attack prey on shore and immediately drag it into the ocean."
  - "**Elgyem**, the Cerebral Pokémon\nThis Pokémon is shrouded in mystery. It’s said to have appeared from a UFO that fell from the sky about 50 years ago."
  - "**Beheeyem**, the Cerebral Pokémon\nIt has strong psychic powers. Using its fingers that flash three different colors, it controls its opponents and rewrites their memories."
  - "**Litwick**, the Candle Pokémon\nLitwick shines a light that absorbs the life energy of people and Pokémon, which becomes the fuel that it burns."
  - "**Lampent**, the Lamp Pokémon\nIt arrives near the moment of death and steals spirit from the body."
  - "**Chandelure**, the Luring Pokémon\nThe spirits burned up in its ominous flame lose their way and wander this world forever."
  - "**Axew**, the Tusk Pokémon\nThey mark their territory by leaving gashes in trees with their tusks. If a tusk breaks, a new one grows in quickly."
  - "**Fraxure**, the Axe Jaw Pokémon\nA broken tusk will not grow back, so it diligently sharpens its tusks on river rocks after the end of a battle."
  - "**Haxorus**, the Axe Jaw Pokémon\nTheir sturdy tusks will stay sharp even if used to cut steel beams. These Pokémon are covered in hard armor."
  - "**Cubchoo**, the Chill Pokémon\nTheir snot is a barometer of health. When healthy, their snot is sticky and the power of their ice moves increases."
  - "**Beartic**, the Freezing Pokémon\nIt freezes its breath to create fangs and claws of ice to fight with. Cold northern areas are its habitat."
  - "**Cryogonal**, the Crystallizing Pokémon\nThey are composed of ice crystals. They capture prey with chains of ice, freezing the prey at -148 degrees Fahrenheit."
  - "**Shelmet**, the Snail Pokémon\nIt evolves when bathed in an electric-like energy along with Karrablast. The reason is still unknown."
  - "**Accelgor**, the Shell Out Pokémon\nWhen its body dries out, it weakens. So, to prevent dehydration, it wraps itself in many layers of thin membrane."
  - "**Stunfisk**, the Trap Pokémon\nIt conceals itself in the mud of the seashore. Then it waits. When prey touch it, it delivers a jolt of electricity."
  - "**Mienfoo**, the Martial Arts Pokémon\nThey seclude themselves in the mountains and devote themselves to training. The form of their kicks and chops differs from pack to pack."
  - "**Mienshao**, the Martial Arts Pokémon\nWhen Mienshao lets out a bizarre wail, you’re in danger. A flurry of kicks and chops too fast to see is about to be unleashed!"
  - "**Druddigon**, the Cave Pokémon\nIt infiltrates tunnels that Pokémon like Diglett and Dugtrio have dug and quietly waits for prey to pass through."
  - "**Golett**, the Automaton Pokémon\nAlthough ancient people apparently built it by working with clay, the source of its energy is unclear."
  - "**Golurk**, the Automaton Pokémon\nWhen the seal on its chest is removed, it rages indiscriminately, turning the whole town around it into a mountain of rubble."
  - "**Pawniard**, the Sharp Blade Pokémon\nIt follows Bisharp’s orders to a tee when it attacks enemies. After slashing an opponent, Pawniard clangs both of its blades together."
  - "**Bisharp**, the Sword Blade Pokémon\nIt leads a group of Pawniard. Bisharp doesn’t even change its expression when it deals the finishing blow to an opponent."
  - "**Bouffalant**, the Bash Buffalo Pokémon\nTheir fluffy fur absorbs damage, even if they strike foes with a fierce headbutt."
  - "**Rufflet**, the Eaglet Pokémon\nKnown as a natural-born warrior, soon after its hatching, it will challenge its parent to a fight in order to gain their acceptance."
  - "**Braviary**, the Valiant Pokémon\nKnown as “the hero of the skies,” this Pokémon is so proud and so brave that it will never retreat, even when it’s injured."
  - "**Vullaby**, the Diapered Pokémon\nIts healthy appetite leads to visible growth spurts. It often has to replace the bones it wears as its size increases."
  - "**Mandibuzz**, the Bone Vulture Pokémon\nIt’s always searching for food for Vullaby. When it finds a weak Pokémon, Mandibuzz swoops it right off to its nest."
  - "**Heatmor**, the Anteater Pokémon\nIt draws in air through its tail, transforms it into fire, and uses it like a tongue. It melts Durant and eats them."
  - "**Durant**, the Iron Ant Pokémon\nThey attack in groups, covering themselves in steel armor to protect themselves from Heatmor."
  - "**Deino**, the Irate Pokémon\nLacking sight, it’s unaware of its surroundings, so it bumps into things and eats anything that moves."
  - "**Zweilous**, the Hostile Pokémon\nAfter it has eaten up all the food in its territory, it moves to another area. Its two heads do not get along."
  - "**Hydreigon**, the Brutal Pokémon\nIt responds to movement by attacking. This scary, three-headed Pokémon devours everything in its path!"
  - "**Larvesta**, the Torch Pokémon\nIt protects itself with flame. Long years ago, people believed Larvesta had a nest on the sun."
  - "**Volcarona**, the Sun Pokémon\nAccording to legends, it was hatched from a flaming cocoon to save people and Pokémon that were suffering from the cold."
  - "**Cobalion**, the Iron Will Pokémon\nIt has a body and heart of steel. It worked with its allies to punish people when they hurt Pokémon."
  - "**Terrakion**, the Cavern Pokémon\nSpoken of in legend, this Pokémon used its phenomenal power to destroy a castle in its effort to protect Pokémon."
  - "**Virizion**, the Grassland Pokémon\nLegends say this Pokémon confounded opponents with its swift movements."
  - "**Tornadus**, the Cyclone Pokémon\nTornadus expels massive energy from its tail, causing severe storms. Its power is great enough to blow houses away."
  - "**Thundurus**, the Bolt Strike Pokémon\nAs it flies around, it shoots lightning all over the place and causes forest fires. It is therefore disliked."
  - "**Reshiram**, the Vast White Pokémon\nWhen Reshiram’s tail flares, the heat energy moves the atmosphere and changes the world’s weather."
  - "**Zekrom**, the Deep Black Pokémon\nConcealing itself in lightning clouds, it flies throughout the Unova region. It creates electricity in its tail."
  - "**Landorus**, the Abundance Pokémon\nFrom the forces of lightning and wind, it creates energy to give nutrients to the soil and make the land abundant."
  - "**Kyurem**, the Boundary Pokémon\nIt generates a powerful, freezing energy inside itself, but its body became frozen when the energy leaked out."
  - "**Keldeo**, the Colt Pokémon\nWhen it is resolute, its body fills with power and it becomes swifter. Its jumps are then too fast to follow."
  - "**Meloetta**, the Melody Pokémon\nIts melodies are sung with a special vocalization method that can control the feelings of those who hear it."
  - "**Genesect**, the Paleozoic Pokémon\nThis Pokémon existed 300 million years ago. Team Plasma altered it and attached a cannon to its back."
  - "**Chespin**, the Spiny Nut Pokémon\nSuch a thick shell of wood covers its head and back that even a direct hit from a truck wouldn’t faze it."
  - "**Quilladin**, the Spiny Armor Pokémon\nThey strengthen their lower bodies by running into one another. They are very kind and won’t start fights."
  - "**Chesnaught**, the Spiny Armor Pokémon\nWhen it takes a defensive posture with its fists guarding its face, it could withstand a bomb blast."
  - "**Fennekin**, the Fox Pokémon\nAs it walks, it munches on a twig in place of a snack. It intimidates opponents by puffing hot air out of its ears."
  - "**Braixen**, the Fox Pokémon\nWhen the twig is plucked from its tail, friction sets the twig alight. The flame is used to send signals to its allies."
  - "**Delphox**, the Fox Pokémon\nUsing psychic power, it generates a fiery vortex of 5,400 degrees Fahrenheit, incinerating foes swept into this whirl of flame."
  - "**Froakie**, the Bubble Frog Pokémon\nIt protects its skin by covering its body in delicate bubbles. Beneath its happy-go-lucky air, it keeps a watchful eye on its surroundings."
  - "**Frogadier**, the Bubble Frog Pokémon\nIts swiftness is unparalleled. It can scale a tower of more than 2,000 feet in a minute’s time."
  - "**Greninja**, the Ninja Pokémon\nIt appears and vanishes with a ninja’s grace. It toys with its enemies using swift movements, while slicing them with throwing stars of sharpest water."
  - "**Bunnelby**, the Digging Pokémon\nIt has ears like shovels. Digging holes strengthens its ears so much that they can sever thick roots effortlessly."
  - "**Diggersby**, the Digging Pokémon\nAs powerful as an excavator, its ears can reduce dense bedrock to rubble. When it’s finished digging, it lounges lazily."
  - "**Fletchling**, the Tiny Robin Pokémon\nIts body is always warm. Trainers who live in cold areas apparently sleep with it in their bed."
  - "**Fletchinder**, the Ember Pokémon\nIts speed right after takeoff already puts it in the top speed class of all bird Pokémon."
  - "**Talonflame**, the Scorching Pokémon\nBird Pokémon make up most of its diet. It approaches at high speeds and smacks them down to the ground with its powerful kick."
  - "**Scatterbug**, the Scatterdust Pokémon\nThe powder that covers its body regulates its temperature, so it can live in any region or climate."
  - "**Spewpa**, the Scatterdust Pokémon\nThe beaks of bird Pokémon can’t begin to scratch its stalwart body. To defend itself, it spews powder."
  - "**Vivillon**, the Scale Pokémon\nThe patterns on this Pokémon’s wings depend on the climate and topography of its habitat. It scatters colorful scales."
  - "**Litleo**, the Lion Cub Pokémon\nThis hot-blooded Pokémon is filled with curiosity. When it gets angry or starts fighting, its short mane gets hot."
  - "**Pyroar**, the Royal Pokémon\nThe temperature of its breath is over 10,000 degrees Fahrenheit, but Pyroar doesn’t use it on its prey. This Pokémon prefers to eat raw meat."
  - "**Flabébé**, the Single Bloom Pokémon\nFlabébé wears a crown made from pollen it’s collected from its flower. The crown has hidden healing properties."
  - "**Floette**, the Single Bloom Pokémon\nIt gives its own power to flowers, pouring its heart into caring for them. Floette never forgives anyone who messes up a flower bed."
  - "**Florges**, the Garden Pokémon\nIts life can span several hundred years. It’s said to devote its entire life to protecting gardens."
  - "**Skiddo**, the Mount Pokémon\nIf it has sunshine and water, it doesn’t need to eat, because it can generate energy from the leaves on its back."
  - "**Gogoat**, the Mount Pokémon\nThey inhabit mountainous regions. The leader of the herd is decided by a battle of clashing horns."
  - "**Pancham**, the Playful Pokémon\nIt’s desperate to intimidate its opponents. Be nice and pretend to be scared if you catch it glaring at you intensely."
  - "**Pangoro**, the Daunting Pokémon\nPangoro is the type to talk with its fists. It doesn’t say much as it pummels opponents with enough force to send a dump truck flying."
  - "**Furfrou**, the Poodle Pokémon\nLeft alone, its fur will grow longer and longer, but it will only allow someone it trusts to cut it."
  - "**Espurr**, the Restraint Pokémon\nIt has enough psychic energy to blast everything within 300 feet of itself, but it has no control over its power."
  - "**Meowstic**, the Constraint Pokémon\nThe eyeball patterns on the interior of its ears emit psychic energy. It keeps the patterns tightly covered because that power is too immense."
  - "**Honedge**, the Sword Pokémon\nIf anyone dares to grab its hilt, it wraps a blue cloth around that person’s arm and drains that person’s life energy completely."
  - "**Doublade**, the Sword Pokémon\nThe complex attack patterns of its two swords are unstoppable, even for an opponent greatly accomplished at swordplay."
  - "**Aegislash**, the Royal Sword Pokémon\nApparently, it can detect the innate qualities of leadership. According to legend, whoever it recognizes is destined to become king."
  - "**Spritzee**, the Perfume Pokémon\nIn the past, rather than using perfume, royal ladies carried a Spritzee that would waft a fragrance they liked."
  - "**Aromatisse**, the Fragrance Pokémon\nIts scent is so overpowering that, unless a Trainer happens to really enjoy the smell, he or she will have a hard time walking alongside it."
  - "**Swirlix**, the Cotton Candy Pokémon\nBecause it eats nothing but sweets, its fur is as sticky sweet as cotton candy."
  - "**Slurpuff**, the Meringue Pokémon\nIts sense of smell is 100 million times better than a human’s, so even the faintest scent tells it about everything in the area. It’s like it can see with its nose!"
  - "**Inkay**, the Revolving Pokémon\nWhen exchanging information with others of its kind, it flashes the light-emitting spots on its body in a complex rhythm."
  - "**Malamar**, the Overturning Pokémon\nIt flashes the pattern on its torso to control its prey and draw them in. The edges of its fins are supremely sharp."
  - "**Binacle**, the Two-Handed Pokémon\nThey stretch and then contract, yanking their rocks along with them in bold hops. They eat seaweed that washes up on the shoreline."
  - "**Barbaracle**, the Collective Pokémon\nBarbaracle’s legs and hands have minds of their own, and they will move independently. But they usually follow the head’s orders."
  - "**Skrelp**, the Mock Kelp Pokémon\nIt’s not good at swimming, so it clings to the seaweed. In the Alola region, it’s often found near Dhelmise."
  - "**Dragalge**, the Mock Kelp Pokémon\nIt blends in with seaweed to ambush its prey and then takes them down with a poisonous liquid strong enough to melt metal."
  - "**Clauncher**, the Water Gun Pokémon\nIt moves around by jetting water from its right pincer. It has a poor sense of balance, so it’s terrible at swimming straight."
  - "**Clawitzer**, the Howitzer Pokémon\nIts right arm is packed with meat. When its pincer falls off, it’s exported to be used as a cooking ingredient."
  - "**Helioptile**, the Generator Pokémon\nThe frills on either side of its head have cells that generate electricity when exposed to sunlight."
  - "**Heliolisk**, the Generator Pokémon\nIt stimulates its muscles with electricity, boosting the strength in its legs and enabling it to run 100 yards in five seconds."
  - "**Tyrunt**, the Royal Heir Pokémon\nTyrunt is spoiled and selfish. It may just be trying to frolic, but sometimes the ones it’s trying to frolic with are gravely injured."
  - "**Tyrantrum**, the Despot Pokémon\nThe king of the ancient world, it can easily crunch a car with the devastating strength of its enormous jaws."
  - "**Amaura**, the Tundra Pokémon\nAmaura was restored successfully, but it’s not expected to live long because of the heat of the current environment."
  - "**Aurorus**, the Tundra Pokémon\nThis usually quiet and kindly Pokémon has a surface temperature of around –240 degrees Fahrenheit."
  - "**Sylveon**, the Intertwining Pokémon\nSylveon wraps its ribbon-like feelers around its Trainer’s arm because this touch enables it to read its Trainer’s feelings."
  - "**Hawlucha**, the Wrestling Pokémon\nIn combat, Hawlucha leaps nimbly about, taking advantage of its opponents’ blind spots. It’s also skilled at using superb submission holds."
  - "**Dedenne**, the Antenna Pokémon\nIts upper whiskers are sensors that survey its surroundings. Its lower whiskers are organs that shoot electricity."
  - "**Carbink**, the Jewel Pokémon\nTo keep the jewels on their bodies free of tarnish, packs of Carbink use their soft manes to polish one another’s jewels."
  - "**Goomy**, the Soft Tissue Pokémon\nIts body is mostly water. If it dries out, it will die, so it’s always sitting with perfect stillness in the shade."
  - "**Sliggoo**, the Soft Tissue Pokémon\nIts entire body is covered with gooey mucus that can dissolve anything. Be sure to put gloves on if you’re going to touch it."
  - "**Goodra**, the Dragon Pokémon\nUnderneath its slimy skin is a thick layer of fat, and the combination of the two makes enemies’ attacks slide right off."
  - "**Klefki**, the Key Ring Pokémon\nLong ago it lived in mines, but once the minerals that make up its diet became scarcer, Klefki began appearing in human settlements."
  - "**Phantump**, the Stump Pokémon\nAn unknown spirit came to lodge in a tree stump, creating this Pokémon. A cure-all can be made from an infusion of its green leaves."
  - "**Trevenant**, the Elder Tree Pokémon\nThis Pokémon controls trees via roots stretching from its feet, and it will attack anyone that dares to ravage the forest."
  - "**Pumpkaboo**, the Pumpkin Pokémon\nIt is said to carry wandering spirits to the place where they belong so they can move on."
  - "**Gourgeist**, the Pumpkin Pokémon\nIt enwraps its prey in its hairlike arms. It sings joyfully as it observes the suffering of its prey."
  - "**Bergmite**, the Ice Chunk Pokémon\nUsing air of -150 degrees Fahrenheit, they freeze opponents solid. They live in herds above the snow line on mountains."
  - "**Avalugg**, the Iceberg Pokémon\nThe way several Bergmite huddle on its back makes it look like an aircraft carrier made of ice."
  - "**Noibat**, the Sound Wave Pokémon\nIt flies around in search of fruit to eat. It uses ultrasonic waves to detect which fruits are ripe."
  - "**Noivern**, the Sound Wave Pokémon\nThis hot-blooded Pokémon attacks anything it sees with ultrasonic waves that can crush boulders."
  - "**Xerneas**, the Life Pokémon\nWhen the horns on its head shine in seven colors, it is said to be sharing everlasting life."
  - "**Yveltal**, the Destruction Pokémon\nWhen its life comes to an end, it absorbs the life energy of every living thing and turns into a cocoon once more."
  - "**Zygarde**, the Order Pokémon\nSome say it can change to an even more powerful form when battling those who threaten the ecosystem."
  - "**Diancie**, the Jewel Pokémon\nIt can instantly create many diamonds by compressing the carbon in the air between its hands."
  - "**Hoopa**, the Mischief Pokémon\nIt is said to be able to seize anything it desires with its six rings and six huge arms. With its power sealed, it is transformed into a much smaller form."
  - "**Volcanion**, the Steam Pokémon\nIt expels its internal steam from the arms on its back. It has enough power to blow away a mountain."
  - "**Rowlet**, the Grass Quill Pokémon\nIt feels relaxed in tight, dark places and has been known to use its Trainer’s pocket or bag as a nest."
  - "**Dartrix**, the Blade Quill Pokémon\nSupremely sensitive to the presence of others, it can detect opponents standing behind it, flinging its sharp feathers to take them out."
  - "**Decidueye**, the Arrow Quill Pokémon\nDecidueye can nock and fire an arrow at an enemy in a tenth of a second, so its battles are decided in the blink of an eye."
  - "**Litten**, the Fire Cat Pokémon\nIts coat regrows twice a year. When the time comes, Litten sets its own body on fire and burns away the old fur."
  - "**Torracat**, the Fire Cat Pokémon\nWhen its mane is standing on end, you can tell it’s feeling good. When it isn’t feeling well, its fur will lie down flat."
  - "**Incineroar**, the Heel Pokémon\nWhen its fighting spirit is set alight, the flames around its waist become especially intense."
  - "**Popplio**, the Sea Lion Pokémon\nPopplio gets on top of its bouncy water balloons to jump higher. It’s quite the acrobatic fighter!"
  - "**Brionne**, the Pop Star Pokémon\nIt attacks by smacking its enemies with the exploding water balloons that it creates."
  - "**Primarina**, the Soloist Pokémon\nAlso known as a songstress, it has a fantastical look on moonlit nights when it leads its colony in song."
  - "**Pikipek**, the Woodpecker Pokémon\nIt may look spindly, but its neck muscles are heavy-duty. It can peck at a tree 16 times per second!"
  - "**Trumbeak**, the Bugle Beak Pokémon\nFrom its mouth, it fires the seeds of berries it has eaten. The scattered seeds give rise to new plants."
  - "**Toucannon**, the Cannon Pokémon\nKnown for forming harmonious couples, this Pokémon is brought to wedding ceremonies as a good luck charm."
  - "**Yungoos**, the Loitering Pokémon\nAlthough it will eat anything, it prefers fresh living things, so it marches down streets in search of prey."
  - "**Gumshoos**, the Stakeout Pokémon\nPatient by nature, this Pokémon loses control of itself and pounces when it spots its favorite meal—Rattata!"
  - "**Grubbin**, the Larva Pokémon\nIt spits a sticky thread to stop opponents in their tracks, and then it grabs them in its sharp, sturdy mandibles to take them down."
  - "**Charjabug**, the Battery Pokémon\nIts stout shell provides excellent defense from attacks. It uses electricity on persistent opponents."
  - "**Vikavolt**, the Stag Beetle Pokémon\nVikavolt flusters opponents with acrobatic flying maneuvers. This creates an opening for it to deliver an electric beam attack."
  - "**Crabrawler**, the Boxing Pokémon\nCrabrawler has been known to mistake Exeggutor for a coconut tree and climb it. The enraged Exeggutor shakes it off and stomps it."
  - "**Crabominable**, the Woolly Crab Pokémon\nBefore it stops to think, it just starts pummeling. There are records of its turning back avalanches with a flurry of punches."
  - "**Oricorio**, the Dancing Pokémon\nThis Oricorio has drunk red nectar. If its Trainer gives the wrong order, this passionate Pokémon becomes fiercely angry."
  - "**Cutiefly**, the Bee Fly Pokémon\nCutiefly can pick up the auras of living things. It skillfully reads those auras to predict its foes’ movements and make fools of them."
  - "**Ribombee**, the Bee Fly Pokémon\nIt can predict the weather from moisture levels and wind direction. Ribombee only reveals itself when there are a few clear days in a row."
  - "**Rockruff**, the Puppy Pokémon\nWhen it rubs the rocks on its neck against you, that’s proof of its love for you. However, the rocks are sharp, so the gesture is quite painful!"
  - "**Lycanroc**, the Wolf Pokémon\nThe rocks in its mane are sharper than a knife. Fragments that break off are treasured as good luck charms."
  - "**Wishiwashi**, the Small Fry Pokémon\nWhen it’s in a jam, its shining eyes attract others of its kind. The light from its eyes is visible almost 25 miles away."
  - "**Mareanie**, the Brutal Star Pokémon\nAside from its head, its body parts regenerate quickly if they’re cut off. After a good night’s sleep, Mareanie is back to normal."
  - "**Toxapex**, the Brutal Star Pokémon\nWith its 12 legs, it creates a dome to shelter within. The flow of the tides doesn’t affect Toxapex in there, so it’s very comfortable."
  - "**Mudbray**, the Donkey Pokémon\nPossessing mighty power, Mudbray can be loaded with 50 times its own body weight and will be totally fine."
  - "**Mudsdale**, the Draft Horse Pokémon\nIt can trudge mountain roads without rest for three days and three nights, all the while dragging a 10-ton load."
  - "**Dewpider**, the Water Bubble Pokémon\nIt can only breathe oxygen that has dissolved in water, so it wears a water bubble on its head when it walks around on land."
  - "**Araquanid**, the Water Bubble Pokémon\nIt has a habit of storing things it values in its water bubble. If its Trainer doesn’t watch out, Araquanid will try to put them in its bubble!"
  - "**Fomantis**, the Sickle Grass Pokémon\nIt loves the sunshine. When it basks in the sunlight regularly, it grows up with vivid coloration."
  - "**Lurantis**, the Bloom Sickle Pokémon\nAs it slashes into its enemies, it looks like it’s dancing. Its elegant appearance has led some to call it the most glamorous Grass Pokémon."
  - "**Morelull**, the Illuminating Pokémon\nIt likes damp dark places. When night falls, the spores filling the caps of its mushrooms glow."
  - "**Shiinotic**, the Illuminating Pokémon\nWhen it starts fighting for territory with Parasect, the entire area gets completely coated in spores!"
  - "**Salandit**, the Toxic Lizard Pokémon\nIt weakens opponents and sends them reeling with its poisonous gas. Salandit doesn’t deal well with Spinda, since it’s always reeling."
  - "**Salazzle**, the Toxic Lizard Pokémon\nIt punishes Salandit that couldn’t bring it food with a fierce slap of its flame-spewing palm."
  - "**Stufful**, the Flailing Pokémon\nStufful hates to be hugged or touched in any way. It will squirm, thrash, and resist with amazing power."
  - "**Bewear**, the Strong Arm Pokémon\nIt boasts tremendous physical strength. Many people call it the most dangerous Pokémon in the Alola region."
  - "**Bounsweet**, the Fruit Pokémon\nIt tries to resist being swallowed by a bird Pokémon by spinning the sepals on its head. It’s usually a fruitless attempt."
  - "**Steenee**, the Fruit Pokémon\nIt bounces around, swinging the sepals on its head with abandon. They’re quite painful when they smack you!"
  - "**Tsareena**, the Fruit Pokémon\nA Pokémon with an aggressive personality and a mastery of kicking, it cackles every time it kicks an opponent."
  - "**Comfey**, the Posy Picker Pokémon\nIt picks flowers and sticks them to its body with fluids it produces. The aroma that wafts from its petals has a healing effect."
  - "**Oranguru**, the Sage Pokémon\nOranguru don’t get along with each other, so they’re always engaging in battles of wits to decide which one is superior."
  - "**Passimian**, the Teamwork Pokémon\nBerries are its weapons as well as the staple of its diet. The one that can throw a berry the farthest is the boss of the troop."
  - "**Wimpod**, the Turn Tail Pokémon\nAn astonishingly cowardly Pokémon, Wimpod will whir its legs at high speeds to run away if anything comes near it."
  - "**Golisopod**, the Hard Scale Pokémon\nIts claws, which it can extend and retract at will, are its greatest weapons. Golisopod is sometimes accompanied by Wimpod."
  - "**Sandygast**, the Sand Heap Pokémon\nIf you build sand mounds when you’re playing, destroy them before you go home, or they may get possessed and become Sandygast."
  - "**Palossand**, the Sand Castle Pokémon\nOnce it has whipped up a sandstorm to halt its opponents in their tracks, this terrifying Pokémon snatches away their vitality."
  - "**Pyukumuku**, the Sea Cucumber Pokémon\nIts entire body is covered in its own slime. If you accidentally step on one, you’ll slip, and it will get mad and smack you!"
  - "**Type: Null**, the Synthetic Pokémon\nThere’s danger of its going on a rampage, so its true power is sealed away beneath its control mask."
  - "**Silvally**, the Synthetic Pokémon\nThrough the bond it formed with its Trainer, its will was strengthened, and it was able to destroy its control mask."
  - "**Minior**, the Meteor Pokémon\nAlthough its outer shell is uncommonly durable, the shock of falling to the ground smashes the shell to smithereens."
  - "**Komala**, the Drowsing Pokémon\nIt remains asleep from birth to death as a result of the sedative properties of the leaves that form its diet."
  - "**Turtonator**, the Blast Turtle Pokémon\nIts exploding shell poses a real danger but is sensitive to moisture. On rainy days, Turtonator takes silent refuge in caves."
  - "**Togedemaru**, the Roly-Poly Pokémon\nIts capacity to produce electricity is somewhat limited, so it gets charged up by letting lightning strike it!"
  - "**Mimikyu**, the Disguise Pokémon\nA gust of wind revealed what hides under this Pokémon’s rag to a passing Trainer, who went home and died painfully that very night."
  - "**Bruxish**, the Gnash Teeth Pokémon\nIts skin is thick enough to fend off Mareanie’s spikes. With its robust teeth, Bruxish crunches up the spikes and eats them."
  - "**Drampa**, the Placid Pokémon\nIt appears in towns and plays with the children. Drampa will protect kids when they’re in danger, so their moms don’t have to worry."
  - "**Dhelmise**, the Sea Creeper Pokémon\nIts chain-like green seaweed can stretch outward for hundreds of yards. For some reason, it gets along well with Skrelp."
  - "**Jangmo-o**, the Scaly Pokémon\nIt will never show an enemy its back in battle. Ancient warriors liked Jangmo-o for its valiant disposition and made it one of their own."
  - "**Hakamo-o**, the Scaly Pokémon\nThe scales it sheds can be molded and processed to make pots and pans. They conduct heat well, so they’re a popular item."
  - "**Kommo-o**, the Scaly Pokémon\nIt battles valiantly with its fists, which are armored in steel scales. Kommo-o specializes in uppercuts."
  - "**Tapu Koko**, the Land Spirit Pokémon\nThe lightning-wielding guardian deity of Melemele, Tapu Koko is brimming with curiosity and appears before people from time to time."
  - "**Tapu Lele**, the Land Spirit Pokémon\nAlthough called a guardian deity, Tapu Lele is devoid of guilt about its cruel disposition and can be described as nature incarnate."
  - "**Tapu Bulu**, the Land Spirit Pokémon\nIt makes ringing sounds with its tail to let others know where it is, avoiding unneeded conflicts. This guardian deity of Ula’ula controls plants."
  - "**Tapu Fini**, the Land Spirit Pokémon\nAlthough it’s called a guardian deity, terrible calamities sometimes befall those who recklessly approach Tapu Fini."
  - "**Cosmog**, the Nebula Pokémon\nWhether or not it’s a Pokémon from this world is a mystery. When it’s in a jam, it warps away to a safe place to hide."
  - "**Cosmoem**, the Protostar Pokémon\nAs it absorbs light, Cosmoem continues to grow. Its golden shell is surprisingly solid."
  - "**Solgaleo**, the Sunne Pokémon\nIn writings from the distant past, it’s called by the name “the beast that devours the sun.”"
  - "**Lunala**, the Moone Pokémon\nIt sometimes summons unknown powers and life-forms here to this world from holes that lead to other worlds."
  - "**Nihilego**, the Parasite Pokémon\nIt appeared in this world from an Ultra Wormhole. Nihilego appears to be a parasite that lives by feeding on people and Pokémon."
  - "**Buzzwole**, the Swollen Pokémon\nBuzzwole goes around showing off its abnormally swollen muscles. It is one kind of Ultra Beast."
  - "**Pheromosa**, the Lissome Pokémon\nAlthough it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives."
  - "**Xurkitree**, the Glowing Pokémon\nThey’ve been dubbed Ultra Beasts. Some of them stand unmoving, like trees, with their arms and legs stuck into the ground."
  - "**Celesteela**, the Launch Pokémon\nAlthough it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives."
  - "**Kartana**, the Drawn Sword Pokémon\nAlthough it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives."
  - "**Guzzlord**, the Junkivore Pokémon\nAn unknown life-form called a UB. It may be constantly hungry—it is certainly always devouring something."
  - "**Necrozma**, the Prism Pokémon\nLight is the source of its energy. If it isn’t devouring light, impurities build up in it and on it, and Necrozma darkens and stops moving."
  - "**Magearna**, the Artificial Pokémon\nBuilt roughly 500 years ago by a scientist, the part called the Soul-Heart is the actual life-form."
  - "**Marshadow**, the Gloomdweller Pokémon\nIt sinks into the shadows of people and Pokémon, where it can understand their feelings and copy their capabilities."
  - "**Poipole**, the Poison Pin Pokémon\nAn Ultra Beast that lives in a different world, it cackles wildly as it sprays its opponents with poison from the needles on its head."
  - "**Naganadel**, the Poison Pin Pokémon\nOne kind of Ultra Beast, it fires a glowing, venomous liquid from its needles. This liquid is also immensely adhesive."
  - "**Stakataka**, the Rampart Pokémon\nWhen stone walls started moving and attacking, the brute’s true identity was this mysterious life-form, which brings to mind an Ultra Beast."
  - "**Blacephalon**, the Fireworks Pokémon\nA UB that appeared from an Ultra Wormhole, it causes explosions, then takes advantage of opponents’ surprise to rob them of their vitality."
  - "**Zeraora**, the Thunderclap Pokémon\nIt approaches its enemies at the speed of lightning, then tears them limb from limb with its sharp claws."
  - "**Meltan**, the Hex Nut Pokémon\nThey live as a group, but when the time comes, one strong Meltan will absorb all the others and evolve."
  - "**Melmetal**, the Hex Nut Pokémon\nCentrifugal force is behind the punches of Melmetal's heavy hex-nut arms. Melmetal is said to deliver the strongest punches of all Pokémon."
  - "**Grookey**, the Chimp Pokémon\nIt attacks with rapid beats of its stick. As it strikes with amazing speed, it gets more and more pumped."
  - "**Thwackey**, the Beat Pokémon\nWhen it’s drumming out rapid beats in battle, it gets so caught up in the rhythm that it won’t even notice that it’s already knocked out its opponent."
  - "**Rillaboom**, the Drummer Pokémon\nThe one with the best drumming techniques becomes the boss of the troop. It has a gentle disposition and values harmony among its group."
  - "**Scorbunny**, the Rabbit Pokémon\nIt has special pads on the backs of its feet, and one on its nose. Once it’s raring to fight, these pads radiate tremendous heat."
  - "**Raboot**, the Rabbit Pokémon\nIt kicks berries right off the branches of trees and then juggles them with its feet, practicing its footwork."
  - "**Cinderace**, the Striker Pokémon\nIt’s skilled at both offense and defense, and it gets pumped up when cheered on. But if it starts showboating, it could put itself in a tough spot."
  - "**Sobble**, the Water Lizard Pokémon\nWhen it gets wet, its skin changes color, and this Pokémon becomes invisible as if it were camouflaged."
  - "**Drizzile**, the Water lizard Pokémon\nHighly intelligent but also very lazy, it keeps enemies out of its territory by laying traps everywhere."
  - "**Inteleon**, the Secret Agent Pokémon\nIts nictitating membranes let it pick out foes’ weak points so it can precisely blast them with water that shoots from its fingertips at Mach 3."
  - "**Skwovet**, the Cheeky Pokémon\nIt eats berries nonstop—a habit that has made it more resilient than it looks. It’ll show up on farms, searching for yet more berries."
  - "**Greedent**, the Greedy Pokémon\nCommon throughout the Galar region, this Pokémon has strong teeth and can chew through the toughest of berry shells."
  - "**Rookidee**, the Tiny Bird Pokémon\nJumping nimbly about, this small-bodied Pokémon takes advantage of even the slightest opportunity to disorient larger opponents."
  - "**Corvisquire**, the Raven Pokémon\nThe lessons of many harsh battles have taught it how to accurately judge an opponent’s strength."
  - "**Corviknight**, the Raven Pokémon\nWith their great intellect and flying skills, these Pokémon very successfully act as the Galar region’s airborne taxi service."
  - "**Blipbug**, the Larva Pokémon\nOften found in gardens, this Pokémon has hairs on its body that it uses to assess its surroundings."
  - "**Dottler**, the Radome Pokémon\nAs it grows inside its shell, it uses its psychic abilities to monitor the outside world and prepare for evolution."
  - "**Orbeetle**, the Seven Spot Pokémon\nIt emits psychic energy to observe and study what’s around it—and what’s around it can include things over six miles away."
  - "**Nickit**, the Fox Pokémon\nCunning and cautious, this Pokémon survives by stealing food from others. It erases its tracks with swipes of its tail as it makes off with its plunder."
  - "**Thievul**, the Fox Pokémon\nWith a lithe body and sharp claws, it goes around stealing food and eggs. Boltund is its natural enemy."
  - "**Gossifleur**, the Flowering Pokémon\nIt whirls around in the wind while singing a joyous song. This delightful display has charmed many into raising this Pokémon."
  - "**Eldegoss**, the Cotton Bloom Pokémon\nThe cotton on the head of this Pokémon can be spun into a glossy, gorgeous yarn—a Galar regional specialty."
  - "**Wooloo**, the Sheep Pokémon\nIf its fleece grows too long, Wooloo won’t be able to move. Cloth made with the wool of this Pokémon is surprisingly strong."
  - "**Dubwool**, the Sheep Pokémon\nIts majestic horns are meant only to impress the opposite gender. They never see use in battle."
  - "**Chewtle**, the Snapping Pokémon\nIt starts off battles by attacking with its rock-hard horn, but as soon as the opponent flinches, this Pokémon bites down and never lets go."
  - "**Drednaw**, the Bite Pokémon\nThis Pokémon rapidly extends its retractable neck to sink its sharp fangs into distant enemies and take them down."
  - "**Yamper**, the Puppy Pokémon\nThis gluttonous Pokémon only assists people with their work because it wants treats. As it runs, it crackles with electricity."
  - "**Boltund**, the Dog Pokémon\nIt sends electricity through its legs to boost their strength. Running at top speed, it easily breaks 50 mph."
  - "**Rolycoly**, the Coal Pokémon\nIt can race around like a unicycle, even on rough, rocky terrain. Burning coal sustains it."
  - "**Carkol**, the Coal Pokémon\nBy rapidly rolling its legs, it can travel at over 18 mph. The temperature of the flames it breathes exceeds 1,800 degrees Fahrenheit."
  - "**Coalossal**, the Coal Pokémon\nWhile it’s engaged in battle, its mountain of coal will burn bright red, sending off sparks that scorch the surrounding area."
  - "**Applin**, the Apple Core Pokémon\nAs soon as it’s born, it burrows into an apple. Not only does the apple serve as its food source, but the flavor of the fruit determines its evolution."
  - "**Flapple**, the Apple Wing Pokémon\nIt flies on wings of apple skin and spits a powerful acid. It can also change its shape into that of an apple."
  - "**Appletun**, the Apple Nectar Pokémon\nIts body is covered in sweet nectar, and the skin on its back is especially yummy. Children used to have it as a snack."
  - "**Silicobra**, the Sand Snake Pokémon\nIt spews sand from its nostrils. While the enemy is blinded, it burrows into the ground to hide."
  - "**Sandaconda**, the Sand Snake Pokémon\nIts unique style of coiling allows it to blast sand out of its sand sac more efficiently."
  - "**Cramorant**, the Gulp Pokémon\nThis hungry Pokémon swallows Arrokuda whole. Occasionally, it makes a mistake and tries to swallow a Pokémon other than its preferred prey."
  - "**Arrokuda**, the Rush Pokémon\nAfter it’s eaten its fill, its movements become extremely sluggish. That’s when Cramorant swallows it up."
  - "**Barraskewda**, the Skewer Pokémon\nIt spins its tail fins to propel itself, surging forward at speeds of over 100 knots before ramming prey and spearing into them."
  - "**Toxel**, the Baby Pokémon\nIt manipulates the chemical makeup of its poison to produce electricity. The voltage is weak, but it can cause a tingling paralysis."
  - "**Toxtricity**, the Punk Pokémon\nThis short-tempered and aggressive Pokémon chugs stagnant water to absorb any toxins it might contain."
  - "**Sizzlipede**, the Radiator Pokémon\nIt wraps prey up with its heated body, cooking them in its coils. Once they’re well-done, it will voraciously nibble them down to the last morsel."
  - "**Centiskorch**, the Radiator Pokémon\nWhile its burning body is already dangerous on its own, this excessively hostile Pokémon also has large and very sharp fangs."
  - "**Clobbopus**, the Tantrum Pokémon\nIts tentacles tear off easily, but it isn’t alarmed when that happens—it knows they’ll grow back. It’s about as smart as a three-year-old."
  - "**Grapploct**, the Tantrum Pokémon\nSearching for an opponent to test its skills against, it emerges onto land. Once the battle is over, it returns to the sea."
  - "**Sinistea**, the Black Tea Pokémon\nThe teacup in which this Pokémon makes its home is a famous piece of antique tableware. Many forgeries are in circulation."
  - "**Polteageist**, the Black Tea Pokémon\nLeaving leftover black tea unattended is asking for this Pokémon to come along and pour itself into it, turning the tea into a new Polteageist."
  - "**Hatenna**, the Calm Pokémon\nIf this Pokémon senses a strong emotion, it will run away as fast as it can. It prefers areas without people."
  - "**Hattrem**, the Serene Pokémon\nUsing the braids on its head, it pummels foes to get them to quiet down. One blow from those braids would knock out a professional boxer."
  - "**Hatterene**, the Silent Pokémon\nIf you’re too loud around it, you risk being torn apart by the claws on its tentacle. This Pokémon is also known as the Forest Witch."
  - "**Impidimp**, the Wily Pokémon\nIt sneaks into people’s homes, stealing things and feasting on the negative energy of the frustrated occupants."
  - "**Morgrem**, the Devious Pokémon\nWith sly cunning, it tries to lure people into the woods. Some believe it to have the power to make crops grow."
  - "**Grimmsnarl**, the Bulk Up Pokémon\nIts hairs work like muscle fibers. When its hairs unfurl, they latch on to opponents, ensnaring them as tentacles would."
  - "**Obstagoon**, the Blocking Pokémon\nIt evolved after experiencing numerous fights. While crossing its arms, it lets out a shout that would make any opponent flinch."
  - "**Perrserker**, the Viking Pokémon\nAfter many battles, it evolved dangerous claws that come together to form daggers when extended."
  - "**Cursola**, the Coral Pokémon\nBe cautious of the ectoplasmic body surrounding its soul. You’ll become stiff as stone if you touch it."
  - "**Sirfetch'd**, the Wild Duck Pokémon\nAfter deflecting attacks with its hard leaf shield, it strikes back with its sharp leek stalk. The leek stalk is both weapon and food."
  - "**Mr. Rime**, the Comedian Pokémon\nIts amusing movements make it very popular. It releases its psychic power from the pattern on its belly."
  - "**Runerigus**, the Grudge Pokémon\nNever touch its shadowlike body, or you’ll be shown the horrific memories behind the picture carved into it."
  - "**Milcery**, the Cream Pokémon\nThey say that any patisserie visited by Milcery is guaranteed success and good fortune."
  - "**Alcremie**, the Cream Pokémon\nWhen Alcremie is content, the cream it secretes from its hands becomes sweeter and richer."
  - "**Falinks**, the Formation Pokémon\nThe six of them work together as one Pokémon. Teamwork is also their battle strategy, and they constantly change their formation as they fight."
  - "**Pincurchin**, the Sea Urchin Pokémon\nIt stores electricity in each spine. Even if one gets broken off, it still continues to emit electricity for at least three hours."
  - "**Snom**, the Worm Pokémon\nIt eats snow that piles up on the ground. The more snow it eats, the bigger and more impressive the spikes on its back grow."
  - "**Frosmoth**, the Frost Moth Pokémon\nIt shows no mercy to any who desecrate fields and mountains. It will fly around on its icy wings, causing a blizzard to chase offenders away."
  - "**Stonjourner**, the Big Rock Pokémon\nOnce a year, on a specific date and at a specific time, they gather out of nowhere and form up in a circle."
  - "**Eiscue**, the Penguin Pokémon\nThis Pokémon keeps its heat-sensitive head cool with ice. It fishes for its food, dangling its single hair into the sea to lure in prey."
  - "**Indeedee**, the Emotion Pokémon\nThrough its horns, it can pick up on the emotions of creatures around it. Positive emotions are the source of its strength."
  - "**Morpeko**, the Two-Sided Pokémon\nIt carries electrically roasted seeds with it as if they’re precious treasures. No matter how much it eats, it always gets hungry again in short order."
  - "**Cufant**, the Copperderm Pokémon\nIf a job requires serious strength, this Pokémon will excel at it. Its copper body tarnishes in the rain, turning a vibrant green color."
  - "**Copperajah**, the Copperderm Pokémon\nThese Pokémon live in herds. Their trunks have incredible grip strength, strong enough to crush giant rocks into powder."
  - "**Dracozolt**, the Fossil Pokémon\nThe powerful muscles in its tail generate its electricity. Compared to its lower body, its upper half is entirely too small."
  - "**Arctozolt**, the Fossil Pokémon\nThis Pokémon lived on prehistoric seashores and was able to preserve food with the ice on its body. It went extinct because it moved so slowly."
  - "**Dracovish**, the Fossil Pokémon\nIts mighty legs are capable of running at speeds exceeding 40 mph, but this Pokémon can’t breathe unless it’s underwater."
  - "**Arctovish**, the Fossil Pokémon\nThe skin on its face is impervious to attack, but breathing difficulties made this Pokémon go extinct anyway."
  - "**Duraludon**, the Alloy Pokémon\nThe special metal that composes its body is very light, so this Pokémon has considerable agility. It lives in caves because it dislikes the rain."
  - "**Dreepy**, the Lingering Pokémon\nIf this weak Pokémon is by itself, a mere child could defeat it. But if Dreepy has friends to help it train, it can evolve and become much stronger."
  - "**Drakloak**, the Caretaker Pokémon\nWithout a Dreepy to place on its head and care for, it gets so uneasy it’ll try to substitute any Pokémon it finds for the missing Dreepy."
  - "**Dragapult**, the Stealth Pokémon\nApparently the Dreepy inside Dragapult’s horns eagerly look forward to being launched out at Mach speeds."
  - "**Zacian**, the Warrior Pokémon\nThis Pokémon has slumbered for many years. Some say it’s Zamazenta’s elder sister—others say the two Pokémon are rivals."
  - "**Zamazenta**, the Warrior Pokémon\nThis Pokémon slept for aeons while in the form of a statue. It was asleep for so long, people forgot that it ever existed."
  - "**Eternatus**, the Gigantic Pokémon\nIt was inside a meteorite that fell 20,000 years ago. There seems to be a connection between this Pokémon and the Dynamax phenomenon."
  - "**Kubfu**, the Wushu Pokémon\nIf Kubfu pulls the long white hair on its head, its fighting spirit heightens and power wells up from the depths of its belly."
  - "**Urshifu**, the Wushu Pokémon\nInhabiting the mountains of a distant region, this Pokémon races across sheer cliffs, training its legs and refining its moves."
  - "**Zarude**, the Rogue Monkey Pokémon\nOnce the vines on Zarude’s body tear off, they become nutrients in the soil. This helps the plants of the forest grow."
  - "**Regieleki**, the Electron Pokémon\nIts entire body is made up of a single organ that generates electrical energy. Regieleki is capable of creating all Galar’s electricity."
  - "**Regidrago**, the Dragon Orb Pokémon\nIts body is composed of crystallized dragon energy. Regidrago is said to have the powers of every dragon Pokémon."
  - "**Glastrier**, the Wild Horse Pokémon\nGlastrier has tremendous physical strength, and the mask of ice covering its face is 100 times harder than diamond."
  - "**Spectrier**, the Swift Horse Pokémon\nAs it dashes through the night, Spectrier absorbs the life-force of sleeping creatures. It craves silence and solitude."
  - "**Calyrex**, the King Pokémon\nCalyrex is known in legend as a king that ruled over Galar in ancient times. It has the power to cause hearts to mend and plants to spring forth."

